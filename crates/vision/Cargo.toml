[package]
name = "vision"
version = "0.1.0"
edition.workspace = true

[dependencies]
nokhwa = { version = "0.10", features = ["input-native"] }
rerun = "0.35"
anyhow = "1"
# Already in the tree via usls; named directly so `session` can write
# and read the JPEGs that make a replay watchable.
image = "0.25"
usls = { version = "0.2.0-alpha.3", features = ["coreml", "vlm"] }
sim-core = { version = "0.1.0", path = "../sim-core" }
belief-viz = { path = "../belief-viz" }
# The command channel to the chip. `hil-protocol` because the host<->chip
# vocabulary is shared rather than reinvented; `serialport` because one
# process must own the port (see src/drive.rs).
hil-protocol = { path = "../hil-protocol", features = ["host"] }
serialport = "4"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Panic discipline. Scoped deliberately: this crate is compiled into
# firmware and/or parses input we do not control, so a panic here is a
# stopped robot. Binaries and build scripts are NOT linted this way —
# panicking at startup is the correct way to fail loudly.
#
# NOTE: `unwrap_or_default()` is deliberately NOT the escape hatch. In a
# control loop, substituting a default for a failed measurement is worse
# than crashing: the robot acts confidently on a fiction. Propagate with
# `?`, or return Option/Result to a caller that can stop.
# STRICTER than the workspace default, deliberately. Cargo does not allow
# inheriting and overriding in the same `[lints]`, so this crate spells its
# own out — including the unsafe gate, which must not be lost by opting out
# of the workspace block.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# `deny`, not `warn`: a panic in the perception path stops the robot mid-chase.
unwrap_used = "deny"
expect_used = "warn"
panic_in_result_fn = "deny"
indexing_slicing = "warn"
