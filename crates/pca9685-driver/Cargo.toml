[package]
name = "pca9685-driver"
version = "0.1.0"
edition.workspace = true

# Same shape as `mpu6050-driver`: no_std on the chip, tested on the Mac
# against a mock bus. The arithmetic that decides where a servo points is
# the part worth testing, and it needs no hardware to test.

[dependencies]
embedded-hal = "1.0"

[dev-dependencies]
embedded-hal-mock = { version = "0.11", default-features = false, features = ["eh1"] }

[lints]
workspace = true
