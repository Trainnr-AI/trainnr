[package]
name = "pca9685-driver"
version = "0.1.0"
edition.workspace = true

# Same shape as `mpu6050-driver`: no_std on the chip, tested on the Mac
# against a mock bus. The arithmetic that decides where a servo points is
# the part worth testing, and it needs no hardware to test.

[features]
# The async twin, for executors where a blocking bus write blinds
# something that matters — on the rig, the 10 kHz encoder sampler.
async = ["dep:embedded-hal-async"]

[dependencies]
embedded-hal = "1.0"
embedded-hal-async = { version = "1.0", optional = true }

[dev-dependencies]
embedded-hal-mock = { version = "0.11", default-features = false, features = ["eh1", "embedded-hal-async"] }

[lints]
workspace = true
