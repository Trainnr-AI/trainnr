# Its own workspace, with its own Cargo.lock: the Studio is the only Rust
# crate in this repository, and cargo runs inside this directory. (It was
# kept apart from the rig's root workspace over a rerun 0.35 against
# re_ui 0.36 wasm-bindgen conflict; the rig's crates and firmware moved to
# Trainnr-AI/rigrs on 2026-10-02.)
[workspace]

[package]
name = "trainnr-studio"
version = "0.2.0-rc.2"
edition = "2021"
license = "Apache-2.0"
description = "The trainnr Studio: the desktop app with the embedded Rerun viewer and the MuJoCo simulator"
repository = "https://github.com/Trainnr-AI/trainnr"
# Released as prebuilt archives on the GitHub release (studio-release.yml),
# never to crates.io.
publish = false

# The Studio (docs/35; chat-free since docs/80, 2026-09-02; code-free
# since 2026-09-09): the window on the loop (docs/76). A project panel
# reads the index the Python side writes; a MuJoCo subprocess renders
# the sim viewport into a shared-memory ring; the ACTUAL Rerun viewer
# fills the data pane (embedded per Rerun's own extend_viewer_ui
# example, fed by a gRPC server on :9876 inside the app). The agent
# lives in the developer's own tool and reaches this window through
# the MCP surface; code stays on the developer's laptop or GitHub.
# Run with `cargo run --release` — the debug viewer's slow ingest is a
# measured hazard (it once wedged the log channel), not a style choice.
#
# egui/eframe pinned to match re_ui 0.36.3's own pin (checked 2026-08-30
# against re_ui's Cargo.toml: egui ^0.36.1, eframe ^0.36.1); rerun 0.36.3
# rides the same tree. Bump all of them together.
[dependencies]
eframe = { version = "0.36.1", default-features = false, features = [
    "wgpu",
    "default_fonts",
] }
egui = "0.36.1"
mimalloc = "0.1.52"
re_ui = "0.36.3"
# A run's viewer file loaded into the viewer (Running now, 2026-09-25).
re_data_source = "0.36.3"
rerun = { version = "0.36.3", default-features = false, features = ["native_viewer", "sdk", "server"] }
# The project panel reads `.index/project.json`, written by the Python
# side (trainnr.project) — the Studio never speaks MCP itself
# (decision 2026-09-08). Both crates are already in Rerun's tree.
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# Tables for the section views; already in the tree via re_ui (which
# styles them: `setup_table_body`). No new dependency weight.
egui_extras = "0.36.1"
# Native file dialogs for the forms' file fields; the same version and
# backend re_viewer already builds (xdg-portal), so no new crate.
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
# The engine's downloads (engine.rs): uv and the runtime over HTTPS, each
# checked by its SHA-256 and unpacked from a tar.gz. ureq, sha2 and flate2
# are the versions Rerun already builds; tar is the one new crate.
ureq = "3.4"
sha2 = "0.11.0"
flate2 = "1"
tar = "0.4"
# PNG encoding for the agent's screenshots (control.rs); already in the
# tree through egui_extras, pinned to the same major.
image = { version = "0.25", default-features = false, features = ["png"] }
# The window backend choice on WSLg (main.rs::prefer_x11_under_wslg):
# winit's X11 extension trait is not re-exported by eframe. Same crate
# instance eframe uses (cargo unifies the version; 0.30 locked).
winit = { version = "0.30", default-features = false, features = ["x11"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "sync", "time"] }

# `kill(pid, 0)` without spawning a process or writing unsafe code: is a
# recorded pid alive (running::pid_alive). Already in the tree through
# eframe's and tokio's dependencies; 1.x locked.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["std", "process"] }

# This standalone workspace has no [workspace.lints] to inherit from, so
# the lint is stated here: no unsafe code in this crate, `forbid` so it
# can't be switched off locally with an `#[allow]`
# (tools/check-unsafe-gates.py checks this line stays).
[lints.rust]
unsafe_code = "forbid"
