# cargo-deny's policy for the Studio's dependencies, run in CI
# (`cargo deny check`): known advisories fail the build, licences must be
# on the allow-list below, and crates come from crates.io only.
#
# An advisory may be ignored only with a reason and a date, and only
# while no fixed version is reachable; Dependabot's weekly update and
# this file's review at each release clear them.

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = [
  # quick-xml 0.36.2 reaches the Studio only through Rerun's URDF and
  # COLLADA readers: urdf-rs 0.9.0 (re_importer) and minidom-14 0.17.0
  # (dae-parser 0.11.0, re_renderer). The fix is quick-xml 0.41.0, which
  # the lock already has through wayland-scanner, but neither reader takes
  # it yet, and Rerun 0.37.2 keeps both (checked on Dependabot's rerun
  # branch, 2026-10-04): the update does not clear these. They clear when
  # urdf-rs and dae-parser move to quick-xml 0.41 and Rerun takes them.
  # Exposure: a slow or memory-hungry parse of a robot file the user
  # opens. 2026-10-04.
  { id = "RUSTSEC-2026-0194", reason = "quick-xml 0.36 via urdf-rs and dae-parser (Rerun 0.36 and 0.37); no release of either takes 0.41" },
  { id = "RUSTSEC-2026-0195", reason = "quick-xml 0.36 via urdf-rs and dae-parser (Rerun 0.36 and 0.37); no release of either takes 0.41" },
  # Unmaintained, not vulnerable: both reach the Studio through Rerun.
  { id = "RUSTSEC-2025-0141", reason = "bincode, unmaintained, via Rerun; no advisory against its code" },
  { id = "RUSTSEC-2024-0436", reason = "paste, unmaintained, via Rerun; a build-time macro" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "0BSD",
  "ISC",
  "Zlib",
  "BSL-1.0",
  "CC0-1.0",
  "Unlicense",
  "Unicode-3.0",
  "CDLA-Permissive-2.0",
  # file-level copyleft: using an unmodified MPL crate is compatible
  # with Apache-2.0; changes to its own files would be MPL.
  "MPL-2.0",
  # fonts embedded by egui and Rerun's UI
  "OFL-1.1",
  "Ubuntu-font-1.0",
]

# The Studio crate itself (FSL-1.1-ALv2, publish = false) is this
# repository's own code: the allow-list is for what it depends on.
[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
