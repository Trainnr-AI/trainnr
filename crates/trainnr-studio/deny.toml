# cargo-deny's policy for the Studio's dependencies, run in CI
# (`cargo deny check`): known advisories fail the build, licences must be
# on the allow-list below, and crates come from crates.io only.
#
# An advisory may be ignored only with a reason and a date, and only
# while no fixed version is reachable; Dependabot's weekly update and
# this file's review at each release clear them.

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = [
  # quick-xml 0.36.2 reaches the Studio only through Rerun's URDF and
  # COLLADA readers: urdf-rs 0.9.0 (re_importer) and minidom-14 0.17.0
  # (dae-parser 0.11.0, re_renderer). The fix is quick-xml 0.41.0, which
  # the lock already has through wayland-scanner, but neither reader takes
  # it yet, and Rerun 0.37.2 keeps both (checked on Dependabot's rerun
  # branch, 2026-10-04): the update does not clear these. They clear when
  # urdf-rs and dae-parser move to quick-xml 0.41 and Rerun takes them.
  # Exposure: a slow or memory-hungry parse of a robot file the user
  # opens. 2026-10-04.
  { id = "RUSTSEC-2026-0194", reason = "quick-xml 0.36 via urdf-rs and dae-parser (Rerun 0.36 and 0.37); no release of either takes 0.41" },
  { id = "RUSTSEC-2026-0195", reason = "quick-xml 0.36 via urdf-rs and dae-parser (Rerun 0.36 and 0.37); no release of either takes 0.41" },
  # Unmaintained, not vulnerable: both reach the Studio through Rerun.
  { id = "RUSTSEC-2025-0141", reason = "bincode, unmaintained, via Rerun; no advisory against its code" },
  { id = "RUSTSEC-2024-0436", reason = "paste, unmaintained, via Rerun; a build-time macro" },
  # Unmaintained, not vulnerable: zvariant, zvariant_derive and zbus_names
  # were merged into zbus 6.0 (its `wire` module) and are no longer released
  # on their own. They reach the Studio through egui's Linux accessibility
  # bridge (accesskit_unix 0.21 and atspi 0.29, on zbus 5): re_ui 0.36 turns
  # on eframe's `accesskit` feature. They clear when AccessKit moves to
  # zbus 6 and egui and Rerun take it. 2026-10-26.
  { id = "RUSTSEC-2026-0370", reason = "zvariant, merged into zbus 6; via accesskit_unix 0.21 (zbus 5), eframe's accesskit feature, on through re_ui 0.36" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names, merged into zbus 6; via accesskit_unix 0.21 (zbus 5), eframe's accesskit feature, on through re_ui 0.36" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive, merged into zbus 6; via accesskit_unix 0.21 (zbus 5), eframe's accesskit feature, on through re_ui 0.36" },
  # zstd 0.13 and zstd-safe 7 reach the Studio through arrow-ipc 58,
  # parquet 58 and mcap 0.25, which Rerun 0.36 pins. The fixes are zstd 0.14
  # and zstd-safe 8; arrow-ipc and parquet 60 and mcap 0.26 take them
  # (crates.io, 2026-10-27), so these clear with the Rerun update that takes
  # those. -0398 needs zstd-safe's `seekable` feature, which is off. Exposure
  # of the other two: a crafted compressed file the user opens (an .rrd,
  # Parquet or MCAP file). 2026-10-27.
  { id = "RUSTSEC-2026-0391", reason = "zstd 0.13 via arrow-ipc 58, parquet 58 and mcap 0.25, pinned by Rerun 0.36; fixed in zstd 0.14" },
  { id = "RUSTSEC-2026-0398", reason = "zstd-safe 7 via zstd 0.13; needs the seekable feature, which is off" },
  { id = "RUSTSEC-2026-0403", reason = "zstd-safe 7 via zstd 0.13 under Rerun 0.36's arrow, parquet and mcap; fixed in zstd-safe 8" },
]
# Known to OSV but not to RustSec, so cargo-deny cannot name it and
# Scorecard's vulnerability check counts it (2026-10-07): thrift 0.17.0
# (GHSA-2f9f-gq7v-9h6m, fixed in 0.23) via parquet 58 under re_importer.
# Rerun 0.37.2 still requires parquet ^58 (crates.io, 2026-10-07); it
# clears when Rerun takes parquet 60. Exposure: a crafted Parquet file the
# user opens.

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "0BSD",
  "ISC",
  "Zlib",
  "BSL-1.0",
  "CC0-1.0",
  "Unlicense",
  "Unicode-3.0",
  "CDLA-Permissive-2.0",
  # file-level copyleft: using an unmodified MPL crate is compatible
  # with Apache-2.0; changes to its own files would be MPL.
  "MPL-2.0",
  # fonts embedded by egui and Rerun's UI
  "OFL-1.1",
  "Ubuntu-font-1.0",
]

# The Studio crate itself (Apache-2.0, publish = false) is this
# repository's own code: the allow-list is for what it depends on.
[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
