# Its own workspace, deliberately not a member of the repo root's — see the
# root Cargo.toml's `exclude` comment for why (rerun 0.35 vs re_ui 0.36.x
# wasm-bindgen conflict). Own Cargo.lock, same fix `firmware/Cargo.toml`
# already uses for an analogous reason.
[workspace]

[package]
name = "studio-shell"
version = "0.1.0"
edition = "2021"
license = "FSL-1.1-ALv2"

# The Studio (the-studio doc; chat-free since docs/64, 2026-09-02): a
# native window where a MuJoCo subprocess renders the sim viewport into
# a shared-memory ring, and the ACTUAL Rerun viewer fills the data pane
# (embedded per Rerun's own extend_viewer_ui example, fed by a gRPC
# server on :9876 inside the app). The agent lives in the developer's
# own tool and reaches this window through the MCP surface.
# Run with `cargo run --release` — the debug viewer's slow ingest is a
# measured hazard (it once wedged the log channel), not a style choice.
#
# egui/eframe pinned to match re_ui 0.36.3's own pin (checked 2026-08-30
# against re_ui's Cargo.toml: egui ^0.36.1, eframe ^0.36.1); rerun 0.36.3
# rides the same tree. Bump all of them together.
[dependencies]
eframe = { version = "0.36.1", default-features = false, features = [
    "wgpu",
    "default_fonts",
] }
egui = "0.36.1"
# Both already in this crate's tree (egui_commonmark via re_ui, similar via
# Rerun) at exactly these versions — the transcript's markdown rendering and
# ± diffs cost zero new dependency weight (checked in Cargo.lock 2026-08-30).
egui_commonmark = "0.25.0"
# Already in the tree too (via re_ui); the `syntect` feature is the one
# genuinely new dependency here — it upgrades the code panel from the
# okish built-in highlighter to real grammars for Python/XML/TOML/etc.
egui_extras = { version = "0.36.1", features = ["syntect"] }
mimalloc = "0.1.52"
re_ui = "0.36.3"
rerun = { version = "0.36.3", default-features = false, features = ["native_viewer", "sdk", "server"] }
similar = "2.7.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time"] }

# This standalone workspace has no [workspace.lints] to inherit from (see
# firmware/Cargo.toml — same shape, same absence). Restated directly instead
# of silently dropped: no unsafe code in this crate, `forbid` so it can't be
# switched off locally with an `#[allow]`.
[lints.rust]
unsafe_code = "forbid"
