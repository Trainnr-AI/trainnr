[package]
name = "arm"
version = "0.1.0"
edition = "2021"
license.workspace = true

# Joint-space control for a serial-chain arm: limits, safety, and plans.
#
# Deliberately knows NOTHING about servos, buses, or geometry. Everything
# here is arithmetic over joint angles, so all of it runs in `cargo test`
# with no hardware — which is the same reason `sim-run` could solve the
# U-trap before a motor existed.

# Two build shapes from ONE source, exactly as `sim-core` does it:
#   default (std)          -> the full crate, incl. `Plan` and the viewer
#   --no-default-features  -> the MCU-safe subset: spec, safety, the traits
#
# The split is not arbitrary. `Guard` is the failsafe, and a failsafe that
# only exists on the laptop dies with the laptop — which for an arm means
# holding forever and cooking, since a powered servo keeps its last goal.
# `Plan` stays on the big machine: turning a policy's action chunk into
# per-tick targets is Tier 2 work, and if it stops arriving the guard
# holds, which is correct.
[features]
default = ["std"]
std = ["sim-core/std"]

[dependencies]
# `CommandWatchdog` is reused, never reimplemented. It takes `now_ms`
# rather than reading a clock, so the type already running on the chip
# works unchanged here — and "has the source gone quiet" keeps one
# definition across the whole project.
sim-core = { path = "../sim-core", default-features = false }

# Fixed-capacity collections, so the joint lists need no allocator. The
# chip has no heap and will not be given one: a control loop that can fail
# to allocate mid-tick is a control loop with a failure mode nobody tests.
heapless = "0.9"

[dev-dependencies]
# Only the viewer needs these. The library itself draws nothing and must
# stay free of them — `cargo test -p arm` should never build a GUI.
rerun = "0.35"
belief-viz = { path = "../belief-viz" }

# No unsafe here. `forbid`, not `deny`: it cannot be switched off locally
# with an `#[allow]`. This crate clamps numbers and interpolates between
# them; if that ever needs unsafe, the argument belongs in the commit
# that changes this line.
[lints.rust]
unsafe_code = "forbid"

# `deny`, not `warn`: this crate runs inside the control loop AND compiles
# into firmware, so a panic here is a stopped robot. Spelled out rather
# than `[lints] workspace = true` because cargo does not allow inheriting
# and overriding in the same block — which means a crate that spells out
# only `unsafe_code` silently inherits NO panic discipline at all. All
# three of these did, until this was noticed.
[lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
panic_in_result_fn = "deny"
indexing_slicing = "warn"
