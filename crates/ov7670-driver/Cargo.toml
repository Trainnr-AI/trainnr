[package]
name = "ov7670-driver"
version = "0.1.0"
edition.workspace = true
license.workspace = true

# no_std on the chip, tested on the Mac against a mock bus — the same
# shape as `mpu6050-driver` and `pca9685-driver`. What is worth testing
# here is the SCCB transaction SHAPE, which is where this part differs
# from every other I2C device on the bus.

[dependencies]
embedded-hal = "1.0"

[dev-dependencies]
embedded-hal-mock = { version = "0.11", default-features = false, features = ["eh1"] }

[lints]
workspace = true
