[package]
name = "blob"
version = "0.1.0"
edition.workspace = true

# Find a coloured object in a frame — on the chip.
#
# Everything else in the vision path runs on the laptop, because a Pico
# has no NPU. This is the part that fits: one pass over 19,200 pixels,
# four accumulators, no allocation. Enough for visual servoing, which
# never asks where anything IS — only for the sign of the error.

[features]
default = ["std"]
std = []

[lints.rust]
unsafe_code = "forbid"

# `deny`, not `warn`: this crate runs inside the control loop AND compiles
# into firmware, so a panic here is a stopped robot. Spelled out rather
# than `[lints] workspace = true` because cargo does not allow inheriting
# and overriding in the same block — which means a crate that spells out
# only `unsafe_code` silently inherits NO panic discipline at all. All
# three of these did, until this was noticed.
[lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
panic_in_result_fn = "deny"
indexing_slicing = "warn"
