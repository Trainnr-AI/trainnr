[package]
name = "hil-protocol"
version = "0.1.0"
edition.workspace = true

# Zero dependencies, no_std, no alloc. This crate is compiled twice — once
# for the Mac (hil-host) and once for ARM (pico-robot) — so it must not
# assume an allocator or an operating system.
[features]
default = []

[dependencies]
# The protocol carries control `Directive`s verbatim, so that the policy
# is expressed once instead of re-derived on each side of the wire.
sim-core = { path = "../sim-core", default-features = false }

# Panic discipline. Scoped deliberately: this crate is compiled into
# firmware and/or parses input we do not control, so a panic here is a
# stopped robot. Binaries and build scripts are NOT linted this way —
# panicking at startup is the correct way to fail loudly.
#
# NOTE: `unwrap_or_default()` is deliberately NOT the escape hatch. In a
# control loop, substituting a default for a failed measurement is worse
# than crashing: the robot acts confidently on a fiction. Propagate with
# `?`, or return Option/Result to a caller that can stop.
# STRICTER than the workspace default, deliberately. Cargo does not allow
# inheriting and overriding in the same `[lints]`, so this crate spells its
# own out — including the unsafe gate, which must not be lost by opting out
# of the workspace block.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# `deny`, not `warn`: this crate is compiled into firmware and parses input
# we do not control, so a panic here is a stopped robot.
unwrap_used = "deny"
expect_used = "warn"
panic_in_result_fn = "deny"
indexing_slicing = "warn"
