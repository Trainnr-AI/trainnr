[package]
name = "hil-host"
version = "0.1.0"
edition.workspace = true

# The laptop half of the hardware-in-the-loop rig: spawns the emulator,
# simulates the robot's body, and visualizes both truth and the chip's
# belief in Rerun. See docs/10-hil-protocol.md.

[dependencies]
sim-core = { path = "../sim-core" }
belief-viz = { path = "../belief-viz" }
blob = { path = "../blob" }
hil-protocol = { path = "../hil-protocol", features = ["host"] }
sim-run = { path = "../sim-run" }
serialport = "4"
rerun = "0.35"

# `odom_view` parses a format string that lives in `firmware/pico-odom`,
# and nothing checks the two against each other. `test = true` makes
# `cargo test` run the example's own tests — without it the tests compile
# and never execute, which is how the format drifted apart unnoticed once
# already. See the header of examples/odom_view.rs.
[[example]]
name = "odom_view"
test = true

[lints]
workspace = true
