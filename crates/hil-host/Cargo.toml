[package]
name = "hil-host"
version = "0.1.0"
edition.workspace = true

# The laptop half of the hardware-in-the-loop rig: spawns the emulator,
# simulates the robot's body, and visualizes both truth and the chip's
# belief in Rerun. See docs/10-hil-protocol.md.

[dependencies]
sim-core = { path = "../sim-core" }
hil-protocol = { path = "../hil-protocol" }
sim-run = { path = "../sim-run" }
serialport = "4"
rerun = "0.35"
