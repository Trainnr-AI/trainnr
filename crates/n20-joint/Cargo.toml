[package]
name = "n20-joint"
version = "0.1.0"
edition.workspace = true

# An arm joint made from a DC gearmotor, so the arm stack can be tested on
# hardware that is already on the bench instead of waiting 4-8 weeks for
# servos. Generic over its port, like `mpu6050-driver` is over its bus, so
# all of it is host-testable and none of it needs a motor to compile.

[features]
default = ["std"]
std = ["arm/std", "sim-core/std"]

[dependencies]
arm = { path = "../arm", default-features = false }
sim-core = { path = "../sim-core", default-features = false }

[lints.rust]
unsafe_code = "forbid"

# `deny`, not `warn`: this crate runs inside the control loop AND compiles
# into firmware, so a panic here is a stopped robot. Spelled out rather
# than `[lints] workspace = true` because cargo does not allow inheriting
# and overriding in the same block — which means a crate that spells out
# only `unsafe_code` silently inherits NO panic discipline at all. All
# three of these did, until this was noticed.
[lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
panic_in_result_fn = "deny"
indexing_slicing = "warn"
