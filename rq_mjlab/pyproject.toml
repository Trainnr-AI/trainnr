# rq_mjlab — the maintained mjlab consumer (docs/e2e-research/58 §2):
# BAM's actuator law ported to CURRENT mjlab and kept there, actuator
# configs that build ONLY from verified bundles, the field-expansion
# event made unforgettable, and a DR linter that turns silent no-ops
# into refusals.
#
# Its own package and its own venv ON PURPOSE: mjlab 1.6 pins
# mujoco~=3.11 with torch/CUDA — a third instrument beside the sim venv
# (3.11 metrology) and the train venv (3.12 + Warp), never a merge of
# them. mjlab ships a breaking minor roughly monthly (1.4 removed
# actuator cfgs, 1.6 changed CollisionCfg and CommandTerm — measured on
# microduck, docs/e2e-research/56 §7); the pin is exact and an upgrade
# is one deliberate PR per minor, mjlab's own ritual.
[project]
name = "rq-mjlab"
version = "0.1.0"
description = "Identified actuator physics for mjlab: BAM's law from certified bundles, with refusals"
requires-python = ">=3.12,<3.13"
license = { text = "FSL-1.1-ALv2" }
dependencies = [
    # The exact minor: the port's whole reason is owning this pin.
    "mjlab==1.6.0",
    # The certified-bundle store's reader and verifier (A1) — a path
    # dependency; the pipeline's BASE install carries no heavy extras.
    "rq-pipeline",
]

[project.optional-dependencies]
# The parity reference only — Rhoban's own package, never a runtime
# dependency (its mjlab extra is walled at mjlab 1.3; we depend on
# nothing behind that wall).
bam = ["better-actuator-models==1.0.2"]

[tool.uv.sources]
rq-pipeline = { path = "../pipeline", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rq_mjlab"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "PL", "RUF"]
