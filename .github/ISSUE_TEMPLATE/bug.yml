name: Bug report
description: Something in trainnr does not do what it says.
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. A bug we can reproduce gets fixed first. Security problems go to the Security tab, never here.
  - type: dropdown
    id: area
    attributes:
      label: Where
      options:
        - MCP server or a tool (trainnr mcp)
        - The Studio (desktop app)
        - Identification (identify_system, check_drift)
        - Training or evaluation (train_walk, evaluate_walk, trainnr-mjlab)
        - Deployment (export, gate, pre-flight)
        - Data (demos, datasets, recordings)
        - Scenes (capture, import)
        - Claude Code plugin, agents or skills
        - Install or docs
        - Not sure
    validations:
      required: true
  - type: textarea
    id: ran
    attributes:
      label: What you ran
      description: The tool call or command, with its arguments. Paste the agent's tool call if an agent made it.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened
      description: "The reply or error. If a job failed, `describe_job(job_id)` gives its `error`, and the whole log is ~/trainnr/projects/<project>/mcp-jobs/<job>.log: paste its tail."
      render: text
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How you installed trainnr
      options:
        - The Claude Code plugin
        - A checkout (git clone)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Plugin version or commit
      description: "With the plugin: the version `/plugin` lists for trainnr, and the `gitCommitSha` of `trainnr@trainnr` in ~/.claude/plugins/installed_plugins.json. From a checkout: `git rev-parse --short HEAD`."
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: Agent client
      options:
        - Claude Code
        - Cursor
        - Codex
        - Other MCP client
        - None (the trainnr command or Python directly)
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: "Ubuntu 24.04 / macOS 15 on an M3 / Windows 11 + WSL2 (Ubuntu 24.04)"
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: GPU and driver
      description: "For training, evaluation on CUDA or the Studio: the GPU and driver version (`nvidia-smi` prints both), or \"none\"."
      placeholder: "RTX 4090, driver 570.86 / Apple M3 / none"
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: A screenshot for a Studio problem, the robot model, the project's stage map.
