# The gates used to run on exactly one machine, through the pre-commit
# hook. This mirrors tools/hooks/pre-commit (plus `cargo test`, which
# the hook leaves to tools/verify.sh) on every push and PR, and runs the
# heavier sim/train-extra suites weekly, where the multi-gigabyte torch
# download is a schedule's problem instead of every contributor's.
name: gates

# Armed 2026-10-02 with the first public push: a protected main requires the fast-gates check, so
# the gates run on pushes to main and on pull requests, the heavy extras
# weekly, and the whole suite stays one click away.
on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # weekly extras, Monday 06:00 UTC
  workflow_dispatch:

# A pull request from a fork runs with a read-only token and no secrets
# (GitHub's default for `pull_request`); nothing here needs more. Never
# switch this workflow to `pull_request_target`: it would run a
# stranger's code with this repository's token.
permissions:
  contents: read

# A newer push to the same branch or pull request cancels the older run.
concurrency:
  group: gates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sign-off:
    # Every commit in a pull request carries a Developer Certificate of
    # Origin sign-off (CONTRIBUTING.md); `git commit -s` adds it.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: every commit is signed off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git show -s --format=%B "$c" | grep -qE '^Signed-off-by: .+ <.+>$'; then
              echo "::error::commit $(git show -s --format='%h %s' "$c") has no Signed-off-by line"
              missing=1
            fi
          done
          if [ "$missing" = 1 ]; then
            echo "Sign off with: git rebase --signoff $BASE && git push --force-with-lease"
            exit 1
          fi

  supply-chain:
    # Every change and every week: one version everywhere, the workflows
    # linted for security (zizmor), the locked Python sets audited for
    # known vulnerabilities, and the Studio's Rust dependencies checked
    # for advisories, licences and sources (cargo-deny). The documented
    # exceptions live in tools/supply-chain.py and the crate's deny.toml.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_DENY_VERSION: "0.20.2"
      CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - name: one version everywhere
        run: python3 tools/release.py check
      - name: workflows linted for security
        run: uvx zizmor --format plain .github/workflows
      - name: cargo-deny, from its release, checksum-verified
        run: |
          name="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl"
          curl -fsSL -o deny.tar.gz "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${name}.tar.gz"
          echo "${CARGO_DENY_SHA256}  deny.tar.gz" | sha256sum -c -
          tar xzf deny.tar.gz && sudo mv "${name}/cargo-deny" /usr/local/bin/
      - name: dependencies audited (Python and Rust)
        run: python3 tools/supply-chain.py

  package:
    # The wheels a user installs from PyPI: both build, and each carries
    # LICENSE and NOTICE (Apache-2.0 4(a) and (d)); trainnr-mjlab's NOTICE
    # is a copy of the root one and must stay identical.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - name: the packages' NOTICE copy matches the root
        run: cmp NOTICE trainnr-mjlab/NOTICE && cmp LICENSE trainnr/LICENSE && cmp LICENSE trainnr-mjlab/LICENSE
      - name: build both wheels; LICENSE and NOTICE inside each
        run: |
          (cd trainnr && uv build --out-dir ../dist)
          (cd trainnr-mjlab && uv build --out-dir ../dist)
          for wheel in dist/*.whl; do
            for f in LICENSE NOTICE; do
              python3 -c "import sys, zipfile; names = zipfile.ZipFile(sys.argv[1]).namelist(); sys.exit(0 if any(n.endswith('.dist-info/licenses/' + sys.argv[2]) for n in names) else 1)" "$wheel" "$f" \
                || { echo "::error::$wheel has no $f"; exit 1; }
            done
            echo "$wheel: LICENSE and NOTICE present"
          done

  python-matrix:
    # The supported Python versions on Linux: the core suite with the sim
    # and mcp extras (fast-gates runs the full set on 3.12).
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MUJOCO_GL: egl
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Mesa's EGL for MuJoCo's renderer
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1-mesa-dri libgles2 libosmesa6
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - name: python tests (trainnr) on Python ${{ matrix.python }}
        run: uv run --python ${{ matrix.python }} --extra sim --extra mcp python -m unittest discover -s tests
        working-directory: trainnr

  macos:
    # The Mac the README promises: the core suite on Apple Silicon.
    if: github.event_name != 'schedule'
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - name: python tests (trainnr) on macOS, Python 3.12
        run: uv run --python 3.12 --extra sim --extra mcp python -m unittest discover -s tests
        working-directory: trainnr

  fast-gates:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The clippy gate greps for lines STARTING with "error". The cache
    # action exports CARGO_TERM_COLOR=always, whose ANSI prefix defeated
    # that grep on CI's second run — a build failure sailed through the
    # clippy gate and only surfaced at `cargo test`. Colors off, grep
    # honest.
    env:
      CARGO_TERM_COLOR: never
      # MuJoCo renders headless through Mesa's EGL on the runner (the same
      # setting trainnr/wsl.env uses under WSL); through GLFW with no display the process
      # aborts (exit 134, the fourth public run of 2026-10-02).
      MUJOCO_GL: egl
      # No debug info in CI builds: the Studio links the whole Rerun
      # viewer, and its debug test binary filled the runner's disk until
      # the linker died with a bus error (every main run from the first
      # public push to 2026-10-03). Line tables keep panics readable.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - name: free the runner's disk (preinstalled SDKs this workflow does not use)
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          df -h / | tail -1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: system libraries (eframe's X11, xkbcommon and GTK links; libudev for the gamepad input; Mesa's EGL and software GL for MuJoCo's renderer)
        run: sudo apt-get update && sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libgtk-3-dev libudev-dev libegl1 libgl1-mesa-dri libgles2 libosmesa6
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: crates/trainnr-studio
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      # the Studio is the one Rust crate (the rig's crates and firmware
      # moved to their own repository on 2026-10-02); it is its own
      # workspace, so cargo runs inside it.
      - name: formatting (trainnr-studio)
        run: cargo fmt --check
        working-directory: crates/trainnr-studio
      - name: clippy (trainnr-studio, no errors)
        # Same bar as the hook: errors block, warnings do not (yet). The
        # output is kept and shown, so a failure on the runner says why
        # (the first public run of 2026-10-02 failed silently).
        run: |
          cargo clippy -q --all-targets 2>&1 | tee clippy.log | tail -60
          ! grep -qE '^error' clippy.log
        working-directory: crates/trainnr-studio
      - name: unsafe still forbidden
        run: python3 tools/check-unsafe-gates.py
      - name: docs describe real code
        run: python3 tools/check-docs.py
      - name: numbers trace to records
        run: python3 tools/check-numbers.py
      - name: package layers (docs/80)
        run: python3 tools/check-layers.py
      - name: cargo test (trainnr-studio)
        run: cargo test -q
        working-directory: crates/trainnr-studio

      # The Python half mirrors tools/verify.sh: the suites need the sim,
      # mcp, deploy and viz extras (the "dependency-free core" of August
      # is long gone: the first public run of 2026-10-02 found 40 modules
      # that import mujoco, gymnasium or scipy). The mjlab trainer and the
      # USD door pull torch and Newton, so they run weekly below.
      - name: ruff format (trainnr)
        run: uvx ruff format --check .
        working-directory: trainnr
      - name: ruff lint (trainnr)
        run: uvx ruff check .
        working-directory: trainnr
      - name: ruff format + lint (tools)
        run: uvx ruff format --check ../tools && uvx ruff check ../tools
        working-directory: trainnr
      - name: ruff lint (trainnr-mjlab)
        run: uvx ruff check src tests
        working-directory: trainnr-mjlab
      - name: mypy (trainnr)
        run: uv run --extra sim --extra mcp --extra deploy --extra viz --with mypy==2.3.1 mypy trainnr
        working-directory: trainnr
      - name: python tests (trainnr), with line coverage
        run: |
          uv run --extra sim --extra mcp --extra deploy --extra viz --with coverage \
            python -m coverage run --source=trainnr -m unittest discover -s tests
          uv run --with coverage python -m coverage report --skip-covered --sort=cover | tail -25 >> "$GITHUB_STEP_SUMMARY"
          uv run --with coverage python -m coverage json -o coverage.json -q
          python3 ../tools/coverage-badge.py coverage.json badge-coverage.json
        working-directory: trainnr
      - name: keep the coverage badge's data
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: badge-coverage
          path: |
            trainnr/badge-coverage.json
            trainnr/badge-coverage.svg
          retention-days: 7

  badges:
    # The one job that writes: after a push to main (a merge), it puts the
    # coverage figure on the `badges` branch, which the README's badge
    # reads. Pull requests never reach it.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: fast-gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: badge-coverage
      - name: publish to the badges branch
        env:
          REPO: ${{ github.repository }}
          TOKEN: ${{ github.token }}
        run: |
          mkdir pub && cd pub
          git init -q -b badges
          cp ../badge-coverage.json coverage.json
          cp ../badge-coverage.svg coverage.svg
          git add coverage.json coverage.svg
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "coverage: $(python3 -c 'import json;print(json.load(open("coverage.json"))["message"])')"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${REPO}.git" badges

  extras-weekly:
    timeout-minutes: 120
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: python tests with sim + train extras
        # The full suite: mujoco.sysid rehearsal, physics census, the
        # LeRobot export roundtrip. uv provisions Python 3.12 so the
        # train extra's marker is satisfied.
        run: |
          uv python install 3.12
          uv sync --python 3.12 --extra sim --extra mcp --extra deploy --extra viz --extra train
          uv run --python 3.12 python -m unittest discover -s tests -v
        working-directory: trainnr
      - name: mypy + python tests (trainnr-mjlab)
        # The mjlab trainer: torch and mujoco-warp, so weekly.
        run: |
          uv sync --extra viz
          uv run --extra viz --with mypy==2.3.1 mypy src/trainnr_mjlab
          uv run --extra viz python -m unittest discover -s tests -t .
        working-directory: trainnr-mjlab
      - name: python tests (USD import, Newton)
        # Its own environment: Newton cannot share a venv with mjx (docs/07
        # 2026-09-25); a skip fails the step, as in tools/verify.sh.
        run: |
          UV_PROJECT_ENVIRONMENT=.venv-usd uv sync --extra usd --extra sim --extra gpu
          TRAINNR_FETCH_TEST_ASSETS=1 .venv-usd/bin/python -m unittest tests.test_usd_import tests.test_import_audit 2>&1 | tee usd.log
          grep -x OK usd.log
        working-directory: trainnr
