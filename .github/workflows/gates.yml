# R5's fix: the 7 gates used to run on exactly one laptop — the hook
# itself warned about hooks that exist on one machine, then had the same
# property. This mirrors tools/hooks/pre-commit (plus `cargo test`, which
# the hook leaves to tools/verify.sh) on every push and PR, and runs the
# heavier sim/train-extra suites weekly, where the multi-gigabyte torch
# download is a schedule's problem instead of every contributor's.
#
# Deliberately NOT here: the emulator run, firmware cross-builds and wire
# replays from tools/verify.sh — those stay pre-push, where the hardware
# recordings and ~9-minute emulator belong.
name: gates

# PARKED 2026-08-23 by operator decision ("dont do CI for now, we will
# do it later"): manual trigger only, no push/PR/schedule runs. Its two
# shakedown runs already paid for themselves — each found a one-laptop
# bug (docs checked against one filesystem; a color-coded error sailing
# through the clippy grep). To re-arm, restore:
#
#   on:
#     push:
#       branches: ["**"]
#     pull_request:
#     schedule:
#       - cron: "0 6 * * 1"   # weekly extras, Monday 06:00 UTC
#     workflow_dispatch:
#
# The jobs' `if:` guards already handle every trigger; a manual dispatch
# meanwhile runs both jobs, so the whole suite stays one click away.
on:
  workflow_dispatch:

jobs:
  fast-gates:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    # The clippy gate greps for lines STARTING with "error". The cache
    # action exports CARGO_TERM_COLOR=always, whose ANSI prefix defeated
    # that grep on CI's second run — a build failure sailed through the
    # clippy gate and only surfaced at `cargo test`. Colors off, grep
    # honest.
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
      - name: system libraries (eframe's X11, xkbcommon and GTK links, for the desktop crate)
        run: sudo apt-get update && sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/trainnr-desktop
      - uses: astral-sh/setup-uv@v5

      # The desktop app is the one Rust crate (the rig's crates and firmware
      # moved to their own repository on 2026-10-02); it is its own
      # workspace, so cargo runs inside it.
      - name: formatting (trainnr-desktop)
        run: cargo fmt --check
        working-directory: crates/trainnr-desktop
      - name: clippy (trainnr-desktop, no errors)
        # Same bar as the hook: errors block, warnings do not (yet).
        run: "! cargo clippy -q --all-targets 2>&1 | grep -qE '^error'"
        working-directory: crates/trainnr-desktop
      - name: unsafe still forbidden
        run: python3 tools/check-unsafe-gates.py
      - name: docs describe real code
        run: python3 tools/check-docs.py
      - name: package layers (docs/80)
        run: python3 tools/check-layers.py
      - name: cargo test (trainnr-desktop)
        run: cargo test -q
        working-directory: crates/trainnr-desktop

      - name: ruff format (trainnr)
        run: uvx ruff format --check .
        working-directory: trainnr
      - name: ruff lint (trainnr)
        run: uvx ruff check .
        working-directory: trainnr
      - name: python tests (trainnr, dependency-free core)
        run: uv run python -m unittest discover -s tests
        working-directory: trainnr

  extras-weekly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: python tests with sim + train extras
        # The full suite: mujoco.sysid rehearsal, physics census, the
        # LeRobot export roundtrip. uv provisions Python 3.12 so the
        # train extra's marker is satisfied.
        run: |
          uv python install 3.12
          uv sync --python 3.12 --extra sim --extra train
          uv run --python 3.12 python -m unittest discover -s tests -v
        working-directory: trainnr
