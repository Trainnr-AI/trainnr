# The gates used to run on exactly one machine, through the pre-commit
# hook. This mirrors tools/hooks/pre-commit (plus `cargo test`, which
# the hook leaves to tools/verify.sh) on every push and PR, and runs the
# heavier sim/train-extra suites weekly, where the multi-gigabyte torch
# download is a schedule's problem instead of every contributor's.
name: gates

# The gates run on pushes to main and on every pull request, the heavy
# extras and the advisory audit weekly, and the whole suite stays one
# click away. The main ruleset (tools/github-setup.sh, applied once the
# repository is public) requires four of these jobs by their ids:
# fast-gates, sign-off, supply-chain and package. A required check is
# matched by the job's name, which is its id while it has no `name:` key,
# so those four keep their ids and get no `name:`; renaming one would
# leave main waiting for a check that never reports.
on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # weekly extras, Monday 06:00 UTC
  workflow_dispatch:

# A pull request from a fork runs with a read-only token and no secrets
# (GitHub's default for `pull_request`); nothing here needs more. Never
# switch this workflow to `pull_request_target`: it would run a
# stranger's code with this repository's token.
permissions:
  contents: read

# A newer push to the same pull request cancels the older run. Pushes to
# main (each merge), the weekly run and a manual run never cancel each
# other or a pull request's run: each event kind has its own group.
concurrency:
  group: gates-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The tools CI runs by name are pinned, so a release of one cannot change
# a gate's verdict overnight. ruff moves with the ruff-pre-commit rev in
# .pre-commit-config.yaml (and tools/verify.sh, tools/hooks/pre-commit).
env:
  RUFF: ruff@0.16.10
  ZIZMOR: zizmor@1.30.1

jobs:
  # Required by the main ruleset: keep the id, add no `name:`.
  sign-off:
    # Every commit in a pull request carries a Developer Certificate of
    # Origin sign-off (CONTRIBUTING.md); `git commit -s` adds it.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: every commit is signed off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git show -s --format=%B "$c" | grep -qE '^Signed-off-by: .+ <.+>$'; then
              echo "::error::commit $(git show -s --format='%h %s' "$c") has no Signed-off-by line"
              missing=1
            fi
          done
          if [ "$missing" = 1 ]; then
            echo "Sign off with: git rebase --signoff $BASE && git push --force-with-lease"
            exit 1
          fi

  # Required by the main ruleset: keep the id, add no `name:`.
  supply-chain:
    # Every change and every week, and deterministic: the same commit
    # gets the same verdict. One version everywhere, the workflows linted
    # for security (zizmor, offline audits), and the Studio's crates
    # checked for licences, bans and sources (cargo-deny against
    # Cargo.lock). Known-vulnerability audits read databases that change
    # without a commit here, so they run in `advisories` below, which is
    # not required. The documented exceptions live in
    # tools/supply-chain.py and the crate's deny.toml.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_DENY_VERSION: "0.20.2"
      CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: one version everywhere
        run: python3 tools/release.py check
      - name: workflows linted for security
        run: uvx "$ZIZMOR" --offline --format plain .github/workflows
      - name: cargo-deny, from its release, checksum-verified
        run: |
          name="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl"
          curl -fsSL -o deny.tar.gz "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${name}.tar.gz"
          echo "${CARGO_DENY_SHA256}  deny.tar.gz" | sha256sum -c -
          tar xzf deny.tar.gz && sudo mv "${name}/cargo-deny" /usr/local/bin/
      - name: the Studio's crates (licences, bans, sources)
        run: python3 tools/supply-chain.py --policy

  advisories:
    # Not required. Known vulnerabilities in every locked Python set
    # (pip-audit) and in the Studio's crates (cargo-deny advisories), on
    # every change and weekly. An advisory published today fails this job
    # on every open pull request at once, a stranger's typo fix included;
    # it is a maintainer's to act on (a bump, or a written exception in
    # tools/supply-chain.py or deny.toml), not a contributor's to unblock.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_DENY_VERSION: "0.20.2"
      CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: cargo-deny, from its release, checksum-verified
        run: |
          name="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl"
          curl -fsSL -o deny.tar.gz "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${name}.tar.gz"
          echo "${CARGO_DENY_SHA256}  deny.tar.gz" | sha256sum -c -
          tar xzf deny.tar.gz && sudo mv "${name}/cargo-deny" /usr/local/bin/
      - name: known vulnerabilities (Python and Rust)
        run: python3 tools/supply-chain.py --advisories

  # Required by the main ruleset: keep the id, add no `name:`.
  package:
    # The wheels a user installs from PyPI: both build, and each carries
    # LICENSE, LICENSES/Apache-2.0.txt and NOTICE (tools/check-package.py); trainnr-mjlab's NOTICE
    # is a copy of the root one and must stay identical.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: the copies match the root; both wheels build with LICENSE and NOTICE
        run: python3 tools/check-package.py

  python-matrix:
    # The supported Python versions on Linux: the core suite with the sim
    # and mcp extras (fast-gates runs the full set on 3.12).
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MUJOCO_GL: egl
      # A stale lockfile fails the run instead of being re-resolved.
      UV_LOCKED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Mesa's EGL for MuJoCo's renderer
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1-mesa-dri libgles2
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: python tests (trainnr) on Python ${{ matrix.python }}
        run: uv run --python ${{ matrix.python }} --extra sim --extra mcp python -m unittest discover -s tests
        working-directory: trainnr

  macos:
    # The Mac the README promises: the core suite on Apple Silicon.
    if: github.event_name != 'schedule'
    runs-on: macos-14
    timeout-minutes: 30
    env:
      UV_LOCKED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: python tests (trainnr) on macOS, Python 3.12
        run: uv run --python 3.12 --extra sim --extra mcp python -m unittest discover -s tests
        working-directory: trainnr

  # Required by the main ruleset: keep the id, add no `name:`.
  fast-gates:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # The clippy gate greps for lines STARTING with "error". The cache
    # action exports CARGO_TERM_COLOR=always, whose ANSI prefix defeated
    # that grep on CI's second run — a build failure sailed through the
    # clippy gate and only surfaced at `cargo test`. Colors off, grep
    # honest.
    env:
      CARGO_TERM_COLOR: never
      # MuJoCo renders headless through Mesa's EGL on the runner (the same
      # setting trainnr/wsl.env uses under WSL); through GLFW with no display the process
      # aborts (exit 134, the fourth public run of 2026-10-02).
      MUJOCO_GL: egl
      # No debug info in CI builds: the Studio links the whole Rerun
      # viewer, and its debug test binary filled the runner's disk until
      # the linker died with a bus error (every main run from the first
      # public push to 2026-10-03). Line tables keep panics readable.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      # `uv run` against a stale lockfile fails instead of re-resolving.
      UV_LOCKED: 1
    steps:
      - name: free the runner's disk (preinstalled SDKs this workflow does not use)
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          df -h / | tail -1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: system libraries (eframe's X11, xkbcommon and GTK links; libudev for the gamepad input; Mesa's EGL for MuJoCo's renderer)
        run: sudo apt-get update && sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libgtk-3-dev libudev-dev libegl1 libgl1-mesa-dri libgles2
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: crates/trainnr-studio
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      # the Studio is the one Rust crate (the rig's crates and firmware
      # moved to their own repository on 2026-10-02); it is its own
      # workspace, so cargo runs inside it.
      - name: formatting (trainnr-studio)
        run: cargo fmt --check
        working-directory: crates/trainnr-studio
      - name: clippy (trainnr-studio, no errors)
        # Same bar as the hook: errors block, warnings do not (yet). The
        # output is kept and shown, so a failure on the runner says why
        # (the first public run of 2026-10-02 failed silently).
        run: |
          cargo clippy -q --all-targets 2>&1 | tee clippy.log | tail -60
          ! grep -qE '^error' clippy.log
        working-directory: crates/trainnr-studio
      - name: unsafe still forbidden
        run: python3 tools/check-unsafe-gates.py
      - name: docs describe real code
        run: python3 tools/check-docs.py
      - name: numbers trace to records
        run: python3 tools/check-numbers.py
      - name: package layers (docs/80)
        run: python3 tools/check-layers.py
      - name: cargo test (trainnr-studio)
        run: cargo test -q
        working-directory: crates/trainnr-studio

      # The Python half mirrors tools/verify.sh: the suites need the sim,
      # mcp, deploy and viz extras (the "dependency-free core" of August
      # is long gone: the first public run of 2026-10-02 found 40 modules
      # that import mujoco, gymnasium or scipy). The mjlab trainer and the
      # USD door pull torch and Newton, so they run weekly below.
      - name: ruff format (trainnr)
        run: uvx "$RUFF" format --check .
        working-directory: trainnr
      - name: ruff lint (trainnr)
        run: uvx "$RUFF" check .
        working-directory: trainnr
      - name: ruff format + lint (tools)
        run: uvx "$RUFF" format --check ../tools && uvx "$RUFF" check ../tools
        working-directory: trainnr
      - name: ruff lint (trainnr-mjlab)
        run: uvx "$RUFF" check src tests
        working-directory: trainnr-mjlab
      - name: mypy (trainnr)
        run: uv run --extra sim --extra mcp --extra deploy --extra viz --with mypy==2.3.1 mypy trainnr
        working-directory: trainnr
      # A renamed tool or argument, a reworded description: the API an
      # agent reads at session start, changed only on purpose.
      - name: MCP tool API matches its snapshot
        run: python3 tools/api-snapshot.py
      - name: python tests (trainnr), with line coverage
        run: |
          uv run --extra sim --extra mcp --extra deploy --extra viz --with coverage \
            python -m coverage run --source=trainnr -m unittest discover -s tests
          uv run --with coverage python -m coverage report --skip-covered --sort=cover | tail -25 >> "$GITHUB_STEP_SUMMARY"
          uv run --with coverage python -m coverage json -o coverage.json -q
          python3 ../tools/coverage-badge.py coverage.json badge-coverage.json
        working-directory: trainnr
      # The environment the tests just installed from the lock, against the
      # licence allow-list; the train, usd and mjlab sets run weekly below.
      - name: licences of the installed Python packages (trainnr)
        run: python3 tools/supply-chain.py --licences trainnr/.venv
      - name: keep the coverage badge's data
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: badge-coverage
          path: |
            trainnr/badge-coverage.json
            trainnr/badge-coverage.svg
          retention-days: 7

  badges:
    # The one job that writes: after a push to main (a merge), it puts the
    # coverage figure on the `badges` branch, which the README's badge
    # reads. Pull requests never reach it.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: fast-gates
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: badge-coverage
      - name: publish to the badges branch
        env:
          REPO: ${{ github.repository }}
          TOKEN: ${{ github.token }}
        run: |
          mkdir pub && cd pub
          git init -q -b badges
          cp ../badge-coverage.json coverage.json
          cp ../badge-coverage.svg coverage.svg
          git add coverage.json coverage.svg
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "coverage: $(python3 -c 'import json;print(json.load(open("coverage.json"))["message"])')"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${REPO}.git" badges

  extras-weekly:
    timeout-minutes: 120
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    env:
      # The full suite renders, as fast-gates' does: headless through
      # Mesa's EGL, or MuJoCo aborts with no display.
      MUJOCO_GL: egl
      UV_LOCKED: 1
    steps:
      - name: free the runner's disk (torch, twice, and Newton)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Mesa's EGL for MuJoCo's renderer
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1-mesa-dri libgles2
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: python tests with sim + train extras
        # The full suite: mujoco.sysid rehearsal, physics census, the
        # LeRobot export roundtrip. uv provisions Python 3.12 so the
        # train extra's marker is satisfied.
        run: |
          uv python install 3.12
          uv sync --python 3.12 --extra sim --extra mcp --extra deploy --extra viz --extra train
          uv run --python 3.12 python -m unittest discover -s tests -v
        working-directory: trainnr
      - name: mypy + python tests (trainnr-mjlab)
        # The mjlab trainer: torch and mujoco-warp, so weekly.
        run: |
          uv sync --extra viz
          uv run --extra viz --with mypy==2.3.1 mypy src/trainnr_mjlab
          uv run --extra viz python -m unittest discover -s tests -t .
        working-directory: trainnr-mjlab
      - name: python tests (USD import, Newton)
        # Its own environment: Newton cannot share a venv with mjx (the log
        # 2026-09-25); a skip fails the step, as in tools/verify.sh.
        run: |
          UV_PROJECT_ENVIRONMENT=.venv-usd uv sync --extra usd --extra sim --extra gpu
          TRAINNR_FETCH_TEST_ASSETS=1 .venv-usd/bin/python -m unittest tests.test_usd_import tests.test_import_audit 2>&1 | tee usd.log
          grep -x OK usd.log
        working-directory: trainnr
      - name: licences of every installed Python set
        # trainnr with the train extra (LeRobot), the usd environment and
        # the mjlab trainer, each against the allow-list and its exceptions.
        run: python3 tools/supply-chain.py --licences trainnr/.venv trainnr/.venv-usd trainnr-mjlab/.venv
