# OpenSSF Scorecard: an outside rating of this repository's security
# practices (branch protection, pinned actions, token permissions,
# signed releases, dependency updates), shown as a README badge and in
# the Security tab. It reads the public repository, so it does nothing
# while the repository is private.
name: scorecard

on:
  push:
    branches: ["main"]
  # A change to branch protection re-scores the Branch-Protection check.
  branch_protection_rule:
  schedule:
    - cron: "30 5 * * 1"
  workflow_dispatch:

# Nothing at the top; the one job asks for exactly what it uses. (When
# publishing results, Scorecard's API refuses a workflow with top-level
# write permissions, env or defaults.)
permissions: {}

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read           # check out the repository
      actions: read            # read the workflow runs some checks score
      security-events: write   # upload the findings to the Security tab
      id-token: write          # publish the result for the badge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif
