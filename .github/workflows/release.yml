# A release: everything a version ships, built by CI from the version's
# tag, never on a laptop.
#
#   - the Studio, prebuilt for Linux (x86_64), macOS (Apple Silicon) and
#     Windows (x86_64), which `trainnr.studio_install` downloads (the
#     plugin's session hook, `launch_studio`, `trainnr studio`), so a user
#     never needs Rust; each archive carries LICENSE,
#     LICENSES/Apache-2.0.txt, NOTICE and THIRD_PARTY_LICENSES.md (every
#     crate's licence, the embedded fonts' included) and has a `.sha256`
#     beside it, which the installer checks;
#   - the Python packages, trainnr and trainnr-mjlab, each as an sdist and
#     a wheel carrying the same licence files;
#   - the app to double-click: a macOS disk image, a Linux AppImage and a
#     Windows installer
#     (tools/package-studio.py); signed and notarized on macOS when the
#     maintainer's Developer ID is in the secrets, unsigned otherwise;
#   - the engine's runtime, the archive the desktop app sets up from
#     (tools/runtime-archive.py), with its SHA-256;
#   - a CycloneDX SBOM for each package and the Studio (tools/sbom.py);
#   - SHA256SUMS over every file.
#
# Every file gets a build-provenance attestation and each SBOM an SBOM
# attestation, signed (Sigstore) with this workflow's identity:
# `gh attestation verify <file> -R Trainnr-AI/trainnr`.
#
# Runs when a maintainer pushes a tag `v*`, or by hand for an existing tag
# (a pre-release such as v0.1.0-rc.1, pushed first). The tag must name the
# version the tree carries (`tools/release.py show`; an -rc.N suffix
# rehearses that version). The release is created as a draft with the
# CHANGELOG's notes for the version and is published by a maintainer once
# every file is attached; nothing is attached when any build failed, and a
# published release is never touched again (GOVERNANCE.md, Releasing).
# release-verify.yml then checks what was published, on all three systems.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing tag to build and attach (e.g. v0.1.0-rc.1)"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  licenses:
    # First: the tag names the tree's version. Then THIRD_PARTY_LICENSES.md,
    # generated once on Linux by cargo-about (installed from its release,
    # checksum-verified), completed with the Apache NOTICE files and the
    # embedded fonts, checked, and shipped in every platform's archive.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_ABOUT_VERSION: "0.9.2"
      CARGO_ABOUT_SHA256: 9099a59e820c38a68b9d65f300662a567d56562f9a10f6aa4c7e86c17c2566af
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: the tag names the version in the tree
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          version=$(python3 tools/release.py show)
          tagged="${TAG#v}"
          # v0.1.0-rc.2 rehearses 0.1.0; a tree bumped to a pre-release
          # (0.2.0-rc.1) is tagged with exactly that.
          if [ "$tagged" != "$version" ] && [ "${tagged%-rc.*}" != "$version" ]; then
            echo "::error::tag $TAG does not name the version in the tree ($version, tools/release.py show)"
            exit 1
          fi
          python3 tools/release.py check
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - name: cargo-about, from its release
        run: |
          name="cargo-about-${CARGO_ABOUT_VERSION}-x86_64-unknown-linux-musl"
          curl -fsSL -o about.tar.gz "https://github.com/EmbarkStudios/cargo-about/releases/download/${CARGO_ABOUT_VERSION}/${name}.tar.gz"
          echo "${CARGO_ABOUT_SHA256}  about.tar.gz" | sha256sum -c -
          tar xzf about.tar.gz && sudo mv "${name}/cargo-about" /usr/local/bin/
      - name: generate
        run: cargo about generate --locked about.hbs -o "$GITHUB_WORKSPACE/THIRD_PARTY_LICENSES.md"
        working-directory: crates/trainnr-studio
      # Apache-2.0 4(d): the NOTICE files of Apache Arrow, DataFusion and
      # the other crates that ship one, and each embedded font's copyright.
      - name: NOTICE files and embedded fonts
        run: python3 tools/third-party-notices.py append THIRD_PARTY_LICENSES.md
      - name: every required attribution present, no HTML escapes
        run: python3 tools/third-party-notices.py check THIRD_PARTY_LICENSES.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: third-party-licenses
          path: THIRD_PARTY_LICENSES.md
          if-no-files-found: error

  build:
    needs: licenses
    # The signing credentials are this environment's secrets, so a job
    # outside it never sees them; its protection rules (a required
    # reviewer, tags only) are set in the repository's settings.
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04        # glibc 2.35: runs on most current Linux
            target: x86_64-unknown-linux-gnu
            timeout: 90
          - os: macos-14            # Apple Silicon
            target: aarch64-apple-darwin
            timeout: 90
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            timeout: 150
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      CARGO_TERM_COLOR: never
      CARGO_PROFILE_RELEASE_STRIP: "true"
      # Signing runs only when the maintainer's credentials are in the
      # repository's secrets (docs/85 §7); without them the release is
      # built exactly as before, unsigned.
      MACOS_SIGNING: ${{ secrets.MACOS_CERTIFICATE_P12 != '' && secrets.APPLE_API_KEY_P8 != '' }}
      WINDOWS_SIGNING: ${{ secrets.ES_USERNAME != '' && secrets.ES_CREDENTIAL_ID != '' }}
    defaults:
      run:
        shell: bash
    steps:
      - name: free the runner's disk (Linux)
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libgtk-3-dev libudev-dev
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: ${{ matrix.target }}
      # No build cache here: a release builds from a clean slate, so a
      # cache written by a pull request can never reach a published binary.
      - name: build
        run: cargo build --release --locked --target ${{ matrix.target }}
        working-directory: crates/trainnr-studio
      # macOS: the Developer ID certificate in a keychain of this job's own,
      # deleted at the end; the identity is read from it, never typed here.
      - name: signing keychain (macOS)
        if: runner.os == 'macOS' && env.MACOS_SIGNING == 'true'
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -base64 24)"
          printf '%s' "$CERTIFICATE_P12" | base64 --decode -o "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/developer-id.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          rm "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)
          if [ -z "$identity" ]; then
            echo "::error::the certificate holds no Developer ID Application identity"
            exit 1
          fi
          printf '%s' "$API_KEY_P8" > "$RUNNER_TEMP/notary.p8"
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
      # Hardened runtime and a secure timestamp, as notarization requires;
      # the Studio needs no entitlements (no JIT, no other team's plug-ins).
      # Signed before it is packaged, so the archive the installer
      # downloads and the app in the disk image carry the same signature.
      - name: sign and notarize the binary (macOS)
        if: runner.os == 'macOS' && env.MACOS_SIGNING == 'true'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          bin="crates/trainnr-studio/target/${{ matrix.target }}/release/trainnr-studio"
          codesign --force --sign "$SIGN_IDENTITY" --keychain "$SIGNING_KEYCHAIN" --timestamp --options runtime "$bin"
          codesign --verify --strict --verbose=2 "$bin"
          python3 tools/notarize.py "$bin" --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: third-party-licenses
          path: notices
      # The exe carries its C runtime (crates/trainnr-studio/.cargo):
      # checked here, since a fresh Windows without the Visual C++
      # Redistributable would refuse to start it.
      - name: no Visual C++ runtime needed (Windows)
        if: runner.os == 'Windows'
        run: python tools/package-studio.py windows-crt-check "crates/trainnr-studio/target/${{ matrix.target }}/release/trainnr-studio.exe"
      # Windows: SSL.com's cloud signing (eSigner), a certificate in the
      # maintainer's name whose key never leaves SSL.com's HSM, as the code
      # signing rules require since 2023; timestamped by the tool itself.
      # Microsoft's own service does not issue to India (docs/85 §7).
      - name: sign the binary (Windows)
        if: runner.os == 'Windows' && env.WINDOWS_SIGNING == 'true'
        uses: SSLcom/esigner-codesign@cf5f6c1d38ad10f47e3ed9aca873f429b1a8d85b # v1.3.2
        with:
          command: sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.ES_CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          file_path: ${{ github.workspace }}/crates/trainnr-studio/target/${{ matrix.target }}/release/trainnr-studio.exe
          override: true
          environment_name: PROD
      - name: the signature holds (Windows)
        if: runner.os == 'Windows' && env.WINDOWS_SIGNING == 'true'
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature "crates/trainnr-studio/target/${{ matrix.target }}/release/trainnr-studio.exe"
          $signature | Format-List Status, StatusMessage, SignerCertificate, TimeStamperCertificate
          if ($signature.Status -ne 'Valid' -or $null -eq $signature.TimeStamperCertificate) {
            Write-Error "trainnr-studio.exe is not validly signed and timestamped"
            exit 1
          }
      - name: package
        run: |
          name="trainnr-studio-${TAG}-${{ matrix.target }}"
          bin="crates/trainnr-studio/target/${{ matrix.target }}/release/trainnr-studio"
          mkdir -p "dist/$name/LICENSES"
          cp LICENSE NOTICE notices/THIRD_PARTY_LICENSES.md "dist/$name/"
          cp LICENSES/Apache-2.0.txt "dist/$name/LICENSES/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "$bin.exe" "dist/$name/"
            (cd dist && 7z a -tzip "$name.zip" "$name" > /dev/null)
            archive="$name.zip"
          else
            cp "$bin" "dist/$name/"
            # Owned by root (0:0) by number, not by the runner's account.
            if [ "${{ runner.os }}" = "macOS" ]; then
              tar -C dist --uid 0 --gid 0 --numeric-owner -czf "dist/$name.tar.gz" "$name"   # bsdtar
            else
              tar -C dist --owner=0 --group=0 --numeric-owner -czf "dist/$name.tar.gz" "$name"
            fi
            archive="$name.tar.gz"
          fi
          cd dist
          if command -v sha256sum >/dev/null; then sha256sum "$archive" > "$archive.sha256"; else shasum -a 256 "$archive" > "$archive.sha256"; fi
          ls -la
      # The app a person double-clicks (tools/package-studio.py, docs/85):
      # an AppImage on Linux, a .app in a disk image on macOS. Unsigned
      # until the maintainer has a Developer ID; Windows has its installer
      # (below) and keeps its zip for the plugin and `trainnr studio`.
      - name: the AppImage (Linux)
        if: runner.os == 'Linux'
        env:
          APPIMAGETOOL_VERSION: "1.9.1"
          APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
        run: |
          bin="crates/trainnr-studio/target/${{ matrix.target }}/release/trainnr-studio"
          python3 tools/package-studio.py linux-appdir "$bin" build/app \
            --version "$(python3 tools/release.py show)" --third-party notices/THIRD_PARTY_LICENSES.md
          curl -fsSL -o appimagetool "https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-x86_64.AppImage"
          echo "${APPIMAGETOOL_SHA256}  appimagetool" | sha256sum -c -
          chmod +x appimagetool
          image="trainnr-${TAG}-x86_64.AppImage"
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool build/app/trainnr.AppDir "dist/$image"
          (cd dist && sha256sum "$image" > "$image.sha256")
      - name: the app and its disk image (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          bin="crates/trainnr-studio/target/${{ matrix.target }}/release/trainnr-studio"
          python3 tools/package-studio.py macos-app "$bin" build/app \
            --version "$(python3 tools/release.py show)" --third-party notices/THIRD_PARTY_LICENSES.md
          resources=build/app/trainnr.app/Contents/Resources
          mkdir -p build/trainnr.iconset
          for size in 16 32 128 256; do
            sips -z "$size" "$size" "$resources/trainnr.png" --out "build/trainnr.iconset/icon_${size}x${size}.png" > /dev/null
          done
          for size in 16 32 128; do
            double=$((size * 2))
            sips -z "$double" "$double" "$resources/trainnr.png" --out "build/trainnr.iconset/icon_${size}x${size}@2x.png" > /dev/null
          done
          iconutil -c icns build/trainnr.iconset -o "$resources/trainnr.icns"
          rm "$resources/trainnr.png"
          # The bundle is sealed last, once its resources are final; the
          # binary inside is the one signed above.
          if [ -n "${SIGN_IDENTITY:-}" ]; then
            codesign --force --sign "$SIGN_IDENTITY" --keychain "$SIGNING_KEYCHAIN" --timestamp --options runtime build/app/trainnr.app
            codesign --verify --deep --strict --verbose=2 build/app/trainnr.app
          fi
          mkdir -p build/disk
          cp -R build/app/trainnr.app build/disk/
          ln -s /Applications build/disk/Applications
          image="trainnr-${TAG}-macos-arm64.dmg"
          hdiutil create -volname trainnr -srcfolder build/disk -ov -format UDZO "dist/$image"
          # The disk image signed, notarized and stapled, so Gatekeeper
          # opens it without asking, offline included.
          if [ -n "${SIGN_IDENTITY:-}" ]; then
            codesign --force --sign "$SIGN_IDENTITY" --keychain "$SIGNING_KEYCHAIN" --timestamp "dist/$image"
            python3 tools/notarize.py "dist/$image" --key "$RUNNER_TEMP/notary.p8" \
              --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID"
            spctl --assess --type open --context context:primary-signature --verbose=2 "dist/$image"
            spctl --assess --type execute --verbose=2 build/app/trainnr.app
          fi
          (cd dist && shasum -a 256 "$image" > "$image.sha256")
      # The Windows installer: one setup.exe (Inno Setup, already on the
      # runner) that installs per user with no administrator prompt, adds
      # a Start-menu entry and an uninstaller (tools/windows-installer.iss).
      - name: the installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = "crates/trainnr-studio/target/${{ matrix.target }}/release/trainnr-studio.exe"
          $version = python tools/release.py show
          $iss = python tools/package-studio.py windows-installer $bin build/app --version $version --third-party notices/THIRD_PARTY_LICENSES.md
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe" }
          $name = "trainnr-$env:TAG-windows-x64-setup"
          & $iscc /Q "/O$PWD\dist" "/F$name" $iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "INSTALLER=dist/$name.exe" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: sign the installer (Windows)
        if: runner.os == 'Windows' && env.WINDOWS_SIGNING == 'true'
        uses: SSLcom/esigner-codesign@cf5f6c1d38ad10f47e3ed9aca873f429b1a8d85b # v1.3.2
        with:
          command: sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.ES_CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          file_path: ${{ github.workspace }}/${{ env.INSTALLER }}
          override: true
          environment_name: PROD
      - name: the installer's checksum (Windows)
        if: runner.os == 'Windows'
        run: |
          cd dist
          image="$(basename "$INSTALLER")"
          sha256sum "$image" > "$image.sha256"
          ls -la
      - name: remove the signing keychain (macOS)
        if: always() && runner.os == 'macOS' && env.SIGNING_KEYCHAIN != ''
        run: |
          security delete-keychain "$SIGNING_KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/notary.p8"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: studio-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.AppImage
            dist/*.dmg
            dist/*-setup.exe
            dist/*.sha256
          if-no-files-found: error

  python:
    # The two Python packages, from the tag on a clean runner (no cache):
    # each sdist and wheel carries LICENSE, LICENSES/Apache-2.0.txt and
    # NOTICE, which check-package.py proves on the same build first.
    needs: licenses
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - name: the packages carry their licences
        run: python3 tools/check-package.py
      - name: build
        run: |
          for package in trainnr trainnr-mjlab; do
            (cd "$package" && uv build --out-dir "$GITHUB_WORKSPACE/dist")
          done
          ls -la dist
      # The engine's runtime: what the desktop app downloads, the first
      # time an action needs it, to run the tools with no checkout
      # (tools/runtime-archive.py, docs/85). Its SHA-256 sits beside it.
      - name: the engine's runtime
        run: python3 tools/runtime-archive.py "$(python3 tools/release.py show)" --out dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-packages
          path: dist/*
          if-no-files-found: error

  sbom:
    # A CycloneDX SBOM for each package (every component its lock pins)
    # and for the Studio (every crate it compiles in): tools/sbom.py.
    needs: licenses
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_CYCLONEDX_VERSION: "0.5.9"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - name: cargo-cyclonedx, at its pinned version and lock
        run: cargo install --locked cargo-cyclonedx --version "$CARGO_CYCLONEDX_VERSION"
      - name: the SBOMs
        run: python3 tools/sbom.py "$(python3 tools/release.py show)" --out dist/sbom
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: dist/sbom/*.cdx.json
          if-no-files-found: error

  publish:
    # Only when every part built: a release missing one would leave its
    # users with a failing download.
    needs: [build, python, sbom]
    if: needs.build.result == 'success' && needs.python.result == 'success' && needs.sbom.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write       # create the draft release and attach the archives
      id-token: write       # sign the build-provenance attestation (Sigstore)
      attestations: write   # store the attestation with the repository
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: studio-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-packages
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
          path: dist
      - name: one checksum file over every file
        run: |
          echo "VERSION=$(python3 tools/release.py show)" >> "$GITHUB_ENV"
          cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - name: notes from the CHANGELOG
        run: |
          python3 - <<'PY'
          import os, re, pathlib
          tag = os.environ["TAG"]
          version = tag.removeprefix("v").split("-rc.")[0]  # a candidate's notes are its version's
          text = pathlib.Path("CHANGELOG.md").read_text()
          m = re.search(r"^## \[" + re.escape(version) + r"\][^\n]*\n(.*?)(?=^## \[|\Z)", text, re.S | re.M)
          body = m.group(1).strip() if m else ""
          footer = (
              "## What this release holds\n\n"
              "- The app to double-click: `trainnr-*-macos-arm64.dmg` (drag trainnr "
              "onto Applications; if macOS says it cannot check the app, a build "
              "made before signing, open it once from System Settings, Privacy & "
              "Security), `trainnr-*-x86_64.AppImage` for Linux, and "
              "`trainnr-*-windows-x64-setup.exe` for Windows, which installs for "
              "you alone with no administrator prompt (if SmartScreen warns, More "
              "info, then Run anyway).\n"
              "- The Studio, prebuilt for Linux (x86_64), macOS (Apple Silicon) and "
              "Windows (x86_64): the plugin and `trainnr studio` download the right one. "
              "Each archive carries LICENSE, LICENSES/Apache-2.0.txt, NOTICE and "
              "THIRD_PARTY_LICENSES.md, with its SHA-256 beside it.\n"
              "- The Python packages `trainnr` and `trainnr-mjlab`, as an sdist and a wheel each.\n"
              "- The engine's runtime (`trainnr-runtime-v*.tar.gz`): what the Studio "
              "downloads the first time an action needs it, to run the tools without "
              "a checkout, with its SHA-256 beside it.\n"
              "- A CycloneDX SBOM (`*.cdx.json`) for each package and the Studio.\n"
              "- `SHA256SUMS` over every file.\n\n"
              "## Verify what you downloaded\n\n"
              "```sh\nsha256sum -c SHA256SUMS\n"
              "gh attestation verify <file> -R Trainnr-AI/trainnr\n```\n\n"
              "Every file has a build-provenance attestation and each SBOM an SBOM "
              "attestation, signed with this repository's release workflow."
          )
          pathlib.Path("notes.md").write_text((body + "\n\n" if body else "") + footer + "\n")
          PY
      # Provenance: each archive's SHA-256 signed with this workflow run's
      # identity, verifiable with `gh attestation verify <archive> -R
      # Trainnr-AI/trainnr`. GitHub offers attestations to public
      # repositories (private ones need Enterprise Cloud), so a rehearsal
      # while the repository is private skips this step.
      - name: build provenance for every file
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.AppImage
            dist/*.dmg
            dist/*-setup.exe
            dist/*.whl
            dist/*.cdx.json
            dist/SHA256SUMS
      - name: the Studio's SBOM, attested for its archives
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: |
            dist/trainnr-studio-*.tar.gz
            dist/trainnr-studio-*.zip
          sbom-path: dist/trainnr-studio-${{ env.VERSION }}.cdx.json
      - name: trainnr's SBOM, attested for its sdist and wheel
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: |
            dist/trainnr-${{ env.VERSION }}.tar.gz
            dist/trainnr-${{ env.VERSION }}-py3-none-any.whl
          sbom-path: dist/trainnr-${{ env.VERSION }}.cdx.json
      - name: trainnr-mjlab's SBOM, attested for its sdist and wheel
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: |
            dist/trainnr_mjlab-${{ env.VERSION }}.tar.gz
            dist/trainnr_mjlab-${{ env.VERSION }}-py3-none-any.whl
          sbom-path: dist/trainnr-mjlab-${{ env.VERSION }}.cdx.json
      - name: attach to a draft release
        run: |
          ls -la dist
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            # A published release is final: its archives are what users
            # have downloaded and checked against their SHA-256. Never
            # replace them; a fix is a new version.
            if [ "$draft" != "true" ]; then
              echo "::error::release $TAG is already published; its archives are never replaced (cut a new version)"
              exit 1
            fi
          else
            flags="--draft"
            case "$TAG" in *-*) flags="$flags --prerelease" ;; esac
            # --verify-tag: the tag is a maintainer's; Actions never creates one.
            gh release create "$TAG" --verify-tag $flags --title "trainnr $TAG" --notes-file notes.md
          fi
          # A draft only: a re-run replaces the draft's own earlier upload.
          gh release upload "$TAG" dist/* --clobber
