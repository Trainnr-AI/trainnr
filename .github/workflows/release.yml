# A release: everything a version ships, built by CI from the version's
# tag, never on a laptop.
#
#   - the Studio, prebuilt for Linux (x86_64), macOS (Apple Silicon) and
#     Windows (x86_64), which `trainnr.studio_install` downloads (the
#     plugin's session hook, `launch_studio`, `trainnr studio`), so a user
#     never needs Rust; each archive carries LICENSE,
#     LICENSES/Apache-2.0.txt, NOTICE and THIRD_PARTY_LICENSES.md (every
#     crate's licence, the embedded fonts' included) and has a `.sha256`
#     beside it, which the installer checks;
#   - the Python packages, trainnr and trainnr-mjlab, each as an sdist and
#     a wheel carrying the same licence files;
#   - a CycloneDX SBOM for each package and the Studio (tools/sbom.py);
#   - SHA256SUMS over every file.
#
# Every file gets a build-provenance attestation and each SBOM an SBOM
# attestation, signed (Sigstore) with this workflow's identity:
# `gh attestation verify <file> -R Trainnr-AI/trainnr`.
#
# Runs when a maintainer pushes a tag `v*`, or by hand for an existing tag
# (a pre-release such as v0.1.0-rc.1, pushed first). The tag must name the
# version the tree carries (`tools/release.py show`; an -rc.N suffix
# rehearses that version). The release is created as a draft with the
# CHANGELOG's notes for the version and is published by a maintainer once
# every file is attached; nothing is attached when any build failed, and a
# published release is never touched again (GOVERNANCE.md, Releasing).
# release-verify.yml then checks what was published, on all three systems.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing tag to build and attach (e.g. v0.1.0-rc.1)"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  licenses:
    # First: the tag names the tree's version. Then THIRD_PARTY_LICENSES.md,
    # generated once on Linux by cargo-about (installed from its release,
    # checksum-verified), completed with the Apache NOTICE files and the
    # embedded fonts, checked, and shipped in every platform's archive.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_ABOUT_VERSION: "0.9.2"
      CARGO_ABOUT_SHA256: 9099a59e820c38a68b9d65f300662a567d56562f9a10f6aa4c7e86c17c2566af
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: the tag names the version in the tree
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          version=$(python3 tools/release.py show)
          tagged="${TAG#v}"
          # v0.1.0-rc.2 rehearses 0.1.0; a tree bumped to a pre-release
          # (0.2.0-rc.1) is tagged with exactly that.
          if [ "$tagged" != "$version" ] && [ "${tagged%-rc.*}" != "$version" ]; then
            echo "::error::tag $TAG does not name the version in the tree ($version, tools/release.py show)"
            exit 1
          fi
          python3 tools/release.py check
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - name: cargo-about, from its release
        run: |
          name="cargo-about-${CARGO_ABOUT_VERSION}-x86_64-unknown-linux-musl"
          curl -fsSL -o about.tar.gz "https://github.com/EmbarkStudios/cargo-about/releases/download/${CARGO_ABOUT_VERSION}/${name}.tar.gz"
          echo "${CARGO_ABOUT_SHA256}  about.tar.gz" | sha256sum -c -
          tar xzf about.tar.gz && sudo mv "${name}/cargo-about" /usr/local/bin/
      - name: generate
        run: cargo about generate --locked about.hbs -o "$GITHUB_WORKSPACE/THIRD_PARTY_LICENSES.md"
        working-directory: crates/trainnr-studio
      # Apache-2.0 4(d): the NOTICE files of Apache Arrow, DataFusion and
      # the other crates that ship one, and each embedded font's copyright.
      - name: NOTICE files and embedded fonts
        run: python3 tools/third-party-notices.py append THIRD_PARTY_LICENSES.md
      - name: every required attribution present, no HTML escapes
        run: python3 tools/third-party-notices.py check THIRD_PARTY_LICENSES.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: third-party-licenses
          path: THIRD_PARTY_LICENSES.md
          if-no-files-found: error

  build:
    needs: licenses
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04        # glibc 2.35: runs on most current Linux
            target: x86_64-unknown-linux-gnu
            timeout: 90
          - os: macos-14            # Apple Silicon
            target: aarch64-apple-darwin
            timeout: 90
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            timeout: 150
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      CARGO_TERM_COLOR: never
      CARGO_PROFILE_RELEASE_STRIP: "true"
    defaults:
      run:
        shell: bash
    steps:
      - name: free the runner's disk (Linux)
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libgtk-3-dev libudev-dev
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: ${{ matrix.target }}
      # No build cache here: a release builds from a clean slate, so a
      # cache written by a pull request can never reach a published binary.
      - name: build
        run: cargo build --release --locked --target ${{ matrix.target }}
        working-directory: crates/trainnr-studio
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: third-party-licenses
          path: notices
      - name: package
        run: |
          name="trainnr-studio-${TAG}-${{ matrix.target }}"
          bin="crates/trainnr-studio/target/${{ matrix.target }}/release/trainnr-studio"
          mkdir -p "dist/$name/LICENSES"
          cp LICENSE NOTICE notices/THIRD_PARTY_LICENSES.md "dist/$name/"
          cp LICENSES/Apache-2.0.txt "dist/$name/LICENSES/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "$bin.exe" "dist/$name/"
            (cd dist && 7z a -tzip "$name.zip" "$name" > /dev/null)
            archive="$name.zip"
          else
            cp "$bin" "dist/$name/"
            # Owned by root (0:0) by number, not by the runner's account.
            if [ "${{ runner.os }}" = "macOS" ]; then
              tar -C dist --uid 0 --gid 0 --numeric-owner -czf "dist/$name.tar.gz" "$name"   # bsdtar
            else
              tar -C dist --owner=0 --group=0 --numeric-owner -czf "dist/$name.tar.gz" "$name"
            fi
            archive="$name.tar.gz"
          fi
          cd dist
          if command -v sha256sum >/dev/null; then sha256sum "$archive" > "$archive.sha256"; else shasum -a 256 "$archive" > "$archive.sha256"; fi
          ls -la
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: studio-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  python:
    # The two Python packages, from the tag on a clean runner (no cache):
    # each sdist and wheel carries LICENSE, LICENSES/Apache-2.0.txt and
    # NOTICE, which check-package.py proves on the same build first.
    needs: licenses
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - name: the packages carry their licences
        run: python3 tools/check-package.py
      - name: build
        run: |
          for package in trainnr trainnr-mjlab; do
            (cd "$package" && uv build --out-dir "$GITHUB_WORKSPACE/dist")
          done
          ls -la dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-packages
          path: dist/*
          if-no-files-found: error

  sbom:
    # A CycloneDX SBOM for each package (every component its lock pins)
    # and for the Studio (every crate it compiles in): tools/sbom.py.
    needs: licenses
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_CYCLONEDX_VERSION: "0.5.9"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - name: cargo-cyclonedx, at its pinned version and lock
        run: cargo install --locked cargo-cyclonedx --version "$CARGO_CYCLONEDX_VERSION"
      - name: the SBOMs
        run: python3 tools/sbom.py "$(python3 tools/release.py show)" --out dist/sbom
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: dist/sbom/*.cdx.json
          if-no-files-found: error

  publish:
    # Only when every part built: a release missing one would leave its
    # users with a failing download.
    needs: [build, python, sbom]
    if: needs.build.result == 'success' && needs.python.result == 'success' && needs.sbom.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write       # create the draft release and attach the archives
      id-token: write       # sign the build-provenance attestation (Sigstore)
      attestations: write   # store the attestation with the repository
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: studio-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-packages
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
          path: dist
      - name: one checksum file over every file
        run: |
          echo "VERSION=$(python3 tools/release.py show)" >> "$GITHUB_ENV"
          cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - name: notes from the CHANGELOG
        run: |
          python3 - <<'PY'
          import os, re, pathlib
          tag = os.environ["TAG"]
          version = tag.removeprefix("v").split("-rc.")[0]  # a candidate's notes are its version's
          text = pathlib.Path("CHANGELOG.md").read_text()
          m = re.search(r"^## \[" + re.escape(version) + r"\][^\n]*\n(.*?)(?=^## \[|\Z)", text, re.S | re.M)
          body = m.group(1).strip() if m else ""
          footer = (
              "## What this release holds\n\n"
              "- The Studio, prebuilt for Linux (x86_64), macOS (Apple Silicon) and "
              "Windows (x86_64): the plugin and `trainnr studio` download the right one. "
              "Each archive carries LICENSE, LICENSES/Apache-2.0.txt, NOTICE and "
              "THIRD_PARTY_LICENSES.md, with its SHA-256 beside it.\n"
              "- The Python packages `trainnr` and `trainnr-mjlab`, as an sdist and a wheel each.\n"
              "- A CycloneDX SBOM (`*.cdx.json`) for each package and the Studio.\n"
              "- `SHA256SUMS` over every file.\n\n"
              "## Verify what you downloaded\n\n"
              "```sh\nsha256sum -c SHA256SUMS\n"
              "gh attestation verify <file> -R Trainnr-AI/trainnr\n```\n\n"
              "Every file has a build-provenance attestation and each SBOM an SBOM "
              "attestation, signed with this repository's release workflow."
          )
          pathlib.Path("notes.md").write_text((body + "\n\n" if body else "") + footer + "\n")
          PY
      # Provenance: each archive's SHA-256 signed with this workflow run's
      # identity, verifiable with `gh attestation verify <archive> -R
      # Trainnr-AI/trainnr`. GitHub offers attestations to public
      # repositories (private ones need Enterprise Cloud), so a rehearsal
      # while the repository is private skips this step.
      - name: build provenance for every file
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.whl
            dist/*.cdx.json
            dist/SHA256SUMS
      - name: the Studio's SBOM, attested for its archives
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: |
            dist/trainnr-studio-*.tar.gz
            dist/trainnr-studio-*.zip
          sbom-path: dist/trainnr-studio-${{ env.VERSION }}.cdx.json
      - name: trainnr's SBOM, attested for its sdist and wheel
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: |
            dist/trainnr-${{ env.VERSION }}.tar.gz
            dist/trainnr-${{ env.VERSION }}-py3-none-any.whl
          sbom-path: dist/trainnr-${{ env.VERSION }}.cdx.json
      - name: trainnr-mjlab's SBOM, attested for its sdist and wheel
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: |
            dist/trainnr_mjlab-${{ env.VERSION }}.tar.gz
            dist/trainnr_mjlab-${{ env.VERSION }}-py3-none-any.whl
          sbom-path: dist/trainnr-mjlab-${{ env.VERSION }}.cdx.json
      - name: attach to a draft release
        run: |
          ls -la dist
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            # A published release is final: its archives are what users
            # have downloaded and checked against their SHA-256. Never
            # replace them; a fix is a new version.
            if [ "$draft" != "true" ]; then
              echo "::error::release $TAG is already published; its archives are never replaced (cut a new version)"
              exit 1
            fi
          else
            flags="--draft"
            case "$TAG" in *-*) flags="$flags --prerelease" ;; esac
            # --verify-tag: the tag is a maintainer's; Actions never creates one.
            gh release create "$TAG" --verify-tag $flags --title "trainnr $TAG" --notes-file notes.md
          fi
          # A draft only: a re-run replaces the draft's own earlier upload.
          gh release upload "$TAG" dist/* --clobber
