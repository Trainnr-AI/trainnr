# The same gate that runs on a laptop, on every push.
#
# `tools/verify.sh` is the single definition of "does this repo work" — CI
# calls it rather than restating its steps, because a workflow file that
# lists them again is one more pair of things that must agree and will not.
#
# `--ci` drops exactly two steps: the emulator (its checkout is gitignored)
# and the stale wire replay. Both are named in verify.sh with the reason.
#
# # Why this matters more than it looks
#
# `docs/18-code-quality.md` has called CI the cheapest large win for a
# while: the pre-commit hooks run on one laptop and `--no-verify` skips
# them, which is not a thing a fleet can be built on. It also dissolves a
# problem that ate an evening — the emulator step got 4x slower when the
# robot's measured speed landed, and the fix is not to make the test weaker
# but to stop running the slow half in a human's edit loop.
name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the two bare-metal targets
        # RP2040 is Cortex-M0+ (thumbv6m, no atomic CAS); RP2350 is
        # Cortex-M33 with an FPU. Both firmware architectures are built,
        # because a change that compiles for one can fail on the other —
        # which is exactly how the missing-atomics constraint was found.
        run: |
          rustup toolchain install stable --profile minimal \
            --component rustfmt,clippy
          rustup target add thumbv6m-none-eabi thumbv8m.main-none-eabihf

      - uses: Swatinem/rust-cache@v2

      - name: Full gate
        run: tools/verify.sh --ci
