# The mjlab trainer's unit tests on CPU, on every change to its package
# (fast-gates lints it; the weekly run adds mypy). Torch and MuJoCo Warp
# make it heavy, so it runs only when trainnr-mjlab/ changes and is never
# a required check.
name: mjlab

on:
  pull_request:
    paths: ["trainnr-mjlab/**", ".github/workflows/mjlab.yml"]
  push:
    branches: ["main"]
    paths: ["trainnr-mjlab/**", ".github/workflows/mjlab.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mjlab-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MUJOCO_GL: egl
      # `uv run` against a stale lockfile fails instead of re-resolving.
      UV_LOCKED: 1
    steps:
      - name: free the runner's disk (torch is large)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Mesa's EGL for MuJoCo's renderer
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1-mesa-dri libgles2
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - name: python tests (trainnr-mjlab, CPU)
        run: uv run --extra viz python -m unittest discover -s tests -t .
        working-directory: trainnr-mjlab
