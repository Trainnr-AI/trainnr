# The Studio, prebuilt: one archive per platform on the GitHub release of
# a version tag, which `trainnr.studio_install` downloads (the plugin's
# session hook, `launch_studio`, `trainnr studio`), so a user never needs
# Rust. Each archive has a `.sha256` beside it; the installer refuses one
# that does not match.
#
# Runs when a maintainer pushes a tag `v*` (the release), or by hand with a
# tag name (a pre-release such as v0.1.0-rc.1 to test the download).
name: studio-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and publish (e.g. v0.1.0-rc.1)"
        required: true

permissions:
  contents: read

concurrency:
  group: studio-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04        # glibc 2.35: runs on most current Linux
            target: x86_64-unknown-linux-gnu
          - os: macos-14            # Apple Silicon
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      CARGO_TERM_COLOR: never
      CARGO_PROFILE_RELEASE_STRIP: "true"
    defaults:
      run:
        shell: bash
    steps:
      - name: free the runner's disk (Linux)
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libgtk-3-dev libudev-dev
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: ${{ matrix.target }}
      # No build cache here: a release builds from a clean slate, so a
      # cache written by a pull request can never reach a published binary.
      - name: build
        run: cargo build --release --locked --target ${{ matrix.target }}
        working-directory: crates/trainnr-studio
      - name: package
        run: |
          name="trainnr-studio-${TAG}-${{ matrix.target }}"
          bin="crates/trainnr-studio/target/${{ matrix.target }}/release/trainnr-studio"
          mkdir -p "dist/$name"
          cp LICENSE NOTICE "dist/$name/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "$bin.exe" "dist/$name/"
            (cd dist && 7z a -tzip "$name.zip" "$name" > /dev/null)
            archive="$name.zip"
          else
            cp "$bin" "dist/$name/"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
            archive="$name.tar.gz"
          fi
          cd dist
          if command -v sha256sum >/dev/null; then sha256sum "$archive" > "$archive.sha256"; else shasum -a 256 "$archive" > "$archive.sha256"; fi
          ls -la
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: studio-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  publish:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # create the release and attach the archives
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: studio-*
          merge-multiple: true
          path: dist
      - name: attach to the release
        run: |
          ls -la dist
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            flags=""
            case "$TAG" in *-*) flags="--prerelease" ;; esac
            gh release create "$TAG" --target "${{ github.sha }}" $flags \
              --title "trainnr $TAG" \
              --notes "The Studio, prebuilt for Linux (x86_64), macOS (Apple Silicon) and Windows (x86_64). The plugin and \`trainnr studio\` download the right one; each archive has its SHA-256 beside it."
          fi
          gh release upload "$TAG" dist/* --clobber
