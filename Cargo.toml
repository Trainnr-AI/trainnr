[workspace]
resolver = "2"
members = [
    "crates/mpu6050-driver",
    "crates/hil-host",
    "crates/quad-encoder",
    "crates/vision",
    "crates/hil-protocol",
    "crates/sim-core",
    "crates/sim-run",
    "crates/belief-viz",
    "crates/teleop-web",
    "crates/arm",
    "crates/blob",
    "crates/n20-joint",
    "crates/pca9685-driver",
    "crates/ov7670-driver",
]
# Firmware builds for a different CPU (ARM Cortex-M) with no_std — it lives
# outside this workspace so `cargo test` here never tries to build it for
# the Mac.
#
# trainnr-desktop depends on re_ui 0.36.x (eframe/egui 0.36.1, wasm-bindgen
# =0.2.126), which conflicts with this workspace's `rerun = "0.35"` pin
# (re_viewer 0.35.0 exact-pins wasm-bindgen =0.2.117 — checked 2026-08-30,
# `cargo build` fails to resolve both in one lock file). It carries its own
# `[workspace]` and `Cargo.lock`, same fix as firmware's, for the same
# reason: one crate on a different dependency generation than everyone
# else. Build it with `cd crates/trainnr-desktop && cargo build`.
exclude = ["firmware", "crates/trainnr-desktop"]

[workspace.package]
edition = "2021"
license = "FSL-1.1-ALv2"

# ---------------------------------------------------------------------
# Lints, declared once for every workspace member.
#
# Each crate opts in with `[lints] workspace = true`, which is one line
# there instead of a block of `#![forbid(...)]` attributes that drift.
# ---------------------------------------------------------------------
[workspace.lints.rust]
# There is currently NO unsafe code anywhere in this repo, and the point of
# forbidding rather than denying it is that `forbid` cannot be locally
# overridden with an `#[allow]`. If a future need is genuine — a DMA buffer,
# a peripheral register — it must be argued for in a commit that changes
# this line, not slipped in behind an attribute.
unsafe_code = "forbid"

[workspace.lints.clippy]
# The panic discipline, workspace-wide. A panic in a control loop is a
# stopped robot; on the chip it is a robot that stops with the motors in
# whatever state they were. These are `warn` rather than `deny` because the
# BINARIES legitimately panic at startup (a bad argument should fail loudly
# and immediately) — the libraries that run inside the loop set them to
# deny individually.
#
# NOTE: `unwrap_or_default()` is deliberately NOT the escape hatch. In a
# control loop, substituting a default for a failed measurement is worse
# than crashing: the robot acts confidently on a fiction.
unwrap_used = "warn"
expect_used = "warn"
indexing_slicing = "warn"
