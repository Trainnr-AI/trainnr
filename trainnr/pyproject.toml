[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trainnr"
version = "0.1.0"
description = "Train, validate and serve robot policies with numbers you can sign: identified dynamics, gated simulation, confidence intervals on everything."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "FSL-1.1-ALv2" }
dependencies = [
    "onnx>=1.22.0",
    "onnxruntime>=1.24.3",
    # pydantic reads the job handles' TypedDicts; on Python < 3.12 only
    # typing_extensions' TypedDict is accepted (mcp_jobs.py).
    "typing-extensions>=4.6; python_version < '3.12'",
]

# The core is dependency-free on purpose: the statistics and bundle layers
# must be recomputable anywhere a report is audited — any Python >= 3.10,
# no scipy, no GPU (uv provisions the interpreter). Heavy stages are
# opt-in extras with their own floors:
[project.optional-dependencies]
# gymnasium is the ecosystem's env interface (trainnr.envs); MIT,
# numpy-only, and LeRobot pins the same major (>=1.1.1,<2).
# mujoco is compatible-release PINNED: the engine version is part of the
# identified artifact (docs/e2e-research/49), and the accidental 3.12 bump
# broke nine tests including physics outcomes. Upgrading is a deliberate
# re-identification event: move the pin, re-run every referee, re-measure.
sim = ["mujoco[sysid]~=3.11.0", "gymnasium>=1.1.1,<2"]
# dataset: LeRobotDataset + video decode; smolvla: the first foundation-model
# rung (fits a 24 GB card); training: wandb + accelerate. gym-aloha stays
# out on purpose: its dm_control dependency pins exact MuJoCo versions and
# the harness is our evaluation environment anyway.
train = ["lerobot[dataset,smolvla,training]>=0.6.1; python_version >= '3.12'"]
# CUDA only; the Mac resolves cleanly without it. Pinned like sim and mjx:
# mujoco-warp tracks MuJoCo release for release, so an open floor here would
# drag the engine version with it.
gpu = ["mujoco-warp~=3.11.0; sys_platform != 'darwin'"]
# The batched GPU rollout path (docs/e2e-research/49): MJX with the Warp
# implementation. Runs on Warp's CPU backend too (measured on the Mac),
# so the adapter's tests run anywhere; only speed needs the NVIDIA card.
# COMPATIBLE-RELEASE PIN, deliberately: an open >=3.12 floor dragged the
# whole project from locked mujoco 3.11.0 to 3.12.0 and NINE tests broke
# (pybind enum comparisons AND physics outcomes — the stack ladder lost
# a trial). The engine version is part of the identified artifact; it
# moves by decision, never as a dependency side effect.
mjx = ["mujoco-mjx[warp]~=3.11.0"]
# viz: the Rerun viewer (no GPU vendor requirement) and TensorBoard's event
# reader - the presenter reads the file rsl_rl already writes into every run
# (all reward terms, the curriculum, the timings) instead of re-deriving a
# curve from console text (2026-09-11: additive over the libraries).
viz = ["rerun-sdk>=0.20", "tensorboard>=2.15"]
# Reading a saved viewer recording back as columns (the headless door):
# Rerun's local catalog needs DataFusion.
viz-query = ["rerun-sdk[datafusion]>=0.20"]
# Captured scenes (docs/78): the visible-surface-to-proxy audit needs Open3D's
# ray casting; collision proxies from meshes need CoACD (MIT; V-HACD is archived).
scene = ["open3d>=0.19", "coacd>=1.0"]
# deploy: the manifest-driven runtime and the sim-to-sim gate run the
# exported ONNX policy; onnx reads the metadata the exporter attached.
deploy = ["onnxruntime>=1.20", "onnx>=1.16"]
# The instrument's MCP surface (trainnr/mcp_server.py): bundles, tasks,
# engines, actuators, runs as queryable tools for any MCP client — the
# Studio's agent panel first. Official SDK, MIT; v2 is a rework of v1, so
# the pin holds the major.
# psutil: the Studio's process liveness (`project/control`), cross-platform.
mcp = ["mcp~=2.1", "psutil>=5.9"]
# openpi's own websocket client (trainnr/envs/openpi_policy.py): pi0 /
# pi0.5 served from their process, evaluated through our env. Pinned to the
# commit it was read at (docs/e2e-research/43); not on PyPI. Its numpy<2 pin
# is overridden below - measured working on numpy 2.2 (2026-08-27).
remote = [
    "openpi-client @ git+https://github.com/Physical-Intelligence/openpi.git@215abfb217dbac7d5f1273282331b9b1866c0479#subdirectory=packages/openpi-client",
]
# dds: the second gate - Unitree's own simulator and controller (docs/77 §7).
# cyclonedds builds against the C library unitree_sdk2 installs under
# /usr/local (`CYCLONEDDS_HOME=/usr/local uv sync --extra dds`); the SDK
# is not on PyPI, hence the git source; evdev is the virtual gamepad.
dds = [
    "cyclonedds>=0.10.2",
    "evdev>=1.9.3",
    "unitree-sdk2py",
]
# usd: native USD assets (Isaac Sim / Omniverse robots) read by Newton's
# importer and bridged to an MjSpec through its MuJoCo solver
# (docs/e2e-research/77). Newton's own `sim` extra is NOT taken: the
# 1.6.0 release declares mujoco-warp 3.12 while our engine is locked at
# 3.11.0 (`gpu`), and the import path measured working on 3.11.0 and
# broken on 3.14 (its contact kernel, 2026-09-24). So the `gpu` extra
# supplies mujoco-warp, this one supplies the reader; COMPATIBLE-RELEASE
# PINNED to the Newton release measured against our engine, and moving
# either pin is one deliberate event.
usd = ["newton[importers]~=1.6.0"]

# The task registry's plugin door (trainnr/tasks/registry.py): a third
# party lists its task module here under its own name and `lerobot-eval
# --env.task=<namespace>/<task>` finds it. Our own two are listed too.
[project.scripts]
# The one command a user types: `trainnr mcp` (an agent's config), `trainnr desktop`.
trainnr = "trainnr.cli:main"

[project.entry-points."trainnr.tasks"]
aloha2 = "trainnr.tasks.aloha2"
so101 = "trainnr.tasks.so101"

# The engine registry's plugin door (trainnr/physics/registry.py): a
# third engine over the same MJCF registers here and enters through the
# same gauntlet.
[project.entry-points."trainnr.engines"]
mujoco = "trainnr.physics.mujoco_backend"
mjx-warp = "trainnr.physics.mjx_backend"

# The GPU-provider registry's plugin door (trainnr/cloud/provider.py):
# a vendor module registers itself with @provider(name) and is listed here.
[project.entry-points."trainnr.gpu_providers"]
runpod = "trainnr.cloud.runpod"

# The robot-adapter registry's plugin door (trainnr/robots/adapter.py):
# a source format registers itself with @adapter(name) and is listed here.
[project.entry-points."trainnr.robot_adapters"]
wire = "trainnr.robots.adapters.wire"
lerobot = "trainnr.robots.adapters.lerobot"
mcap = "trainnr.robots.adapters.mcap"
rosbag2 = "trainnr.robots.adapters.rosbag2"

# The model-source registry's plugin door (trainnr/robot/onboarding.py):
# a robot file format registers itself with @model_source(name, suffixes)
# and the onboarding door dispatches on the suffix. The built-ins (MJCF,
# USD through Newton) are imported by the registry itself.
[project.entry-points."trainnr.model_sources"]
usd = "trainnr.robot.usd_import"

[project.entry-points."trainnr.identification_methods"]
drivetrain-ratio = "trainnr.robot.methods:DrivetrainRatio"

[tool.setuptools.packages.find]
include = ["trainnr*"]

[tool.setuptools.package-data]
# PEP 561: the package's own annotations are its types for whoever
# imports it (trainnr_mjlab, third parties).
trainnr = ["py.typed"]

# Ruff is the whole lint/format story — same role clippy+rustfmt play for
# the crates, and the pre-commit gate runs it the same way. Rules mirror
# docs/18-code-quality.md: no unused anything, no shadowed builtins,
# modern syntax for the real floor, complexity kept visible.
[tool.uv]
# openpi-client declares numpy<2 (its pyproject, 2026-08-27); the client's
# msgpack-numpy codec round-trips on numpy 2.2 (measured) and the train
# venv's torch/mujoco/jax need numpy 2, so the pin is overridden here, once.
override-dependencies = ["numpy>=1.26"]
# The batched MJX path locks warp-lang at 1.14 (mujoco-mjx[warp] 3.11.0)
# and Newton 1.6 needs warp-lang 1.17: the two extras cannot share a
# venv, and the lock says so instead of failing to resolve (2026-09-24).
# A USD import happens once, at onboarding; the bundle it writes runs on
# every extra.
conflicts = [[{ extra = "mjx" }, { extra = "usd" }]]

[tool.uv.sources]
unitree-sdk2py = { git = "https://github.com/unitreerobotics/unitree_sdk2_python" }

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import order
    "N",   # naming
    "UP",  # pyupgrade (respects the py310 floor)
    "B",   # bugbear
    "SIM", # simplification
    "RUF", # ruff-native checks
    "PL",  # pylint subset: complexity + magic values stay visible
]
# PLR2004 (magic values) stays ON: dangling literals get names, as in the
# Rust crates.

[tool.mypy]
# Zero errors is the baseline; tools/verify.sh gates it, run INSIDE this
# project's environment so rerun/torch/jax/numpy/gymnasium (py.typed) are
# checked for real. Run isolated (plain `uvx mypy`, until 2026-09-13)
# every installed package read as Any and the check proved nothing about
# how we call them. The global ignore covers packages absent here.
python_version = "3.10"
ignore_missing_imports = true
files = ["trainnr"]

[[tool.mypy.overrides]]
# The untyped C extensions: no py.typed, their API lives in compiled
# modules mypy cannot read, so their Python shells are skipped (Any)
# rather than read as modules with no attributes.
module = ["mujoco", "mujoco.*", "mujoco_warp", "mujoco_warp.*", "warp", "warp.*", "lerobot", "lerobot.*"]
follow_imports = "skip"
