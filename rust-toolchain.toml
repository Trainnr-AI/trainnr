# The Rust toolchain is part of the artifact, pinned like MuJoCo is.
# 1.97.1 stable is the compiler the full gate last ran green on (the Mac,
# 2026-08-27). The 2026-08-26 nightly links every firmware image with
# "undefined symbol: __aeabi_uread4" — its core::ptr::read_unaligned emits
# an EABI helper its compiler_builtins no longer ships on thumbv6m — so an
# unpinned box gets a compiler-dependent verdict. rustup installs this
# toolchain, with these targets, on the first cargo invocation.
[toolchain]
channel = "1.97.1"
components = ["rustfmt", "clippy", "rust-src"]
targets = ["thumbv6m-none-eabi", "thumbv8m.main-none-eabihf"]
