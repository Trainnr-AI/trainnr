[package]
name = "pico-led"
version.workspace = true
edition.workspace = true

# The onboard LED on a Pico 2 W is NOT on GP25 — GP25 is the wireless
# chip's chip-select. The LED hangs off the CYW43439's own GPIO 0, so
# lighting it means booting the radio. See docs/09 and hw-00.
#
#   tools/build-pico2.sh pico-led     # RP2350 — the only chip this makes
#                                     # sense on; RP2040 Picos have no radio

[features]
default = ["rp2040"]
rp2040 = ["embassy-rp/rp2040", "embassy-rp/boot2-w25q080"]
pico2 = ["embassy-rp/rp235xa", "embassy-rp/imagedef-secure-exe"]

[dependencies]
embassy-executor = { workspace = true }
embassy-rp = { workspace = true }
embassy-time = { workspace = true }
cyw43 = { workspace = true }
cyw43-firmware = { workspace = true }
cyw43-pio = { workspace = true }
static_cell = { workspace = true }
cortex-m = { workspace = true }
cortex-m-rt = { workspace = true }
panic-halt = { workspace = true }

[build-dependencies]
firmware-build-support = { workspace = true }

