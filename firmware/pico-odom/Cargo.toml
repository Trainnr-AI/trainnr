[package]
name = "pico-odom"
version.workspace = true
edition.workspace = true

# H2b: read a real sensor over I2C, using OUR driver crate — the same
# crate that is unit-tested on the Mac with a mocked bus.

[features]
default = ["rp2040"]
rp2040 = ["embassy-rp/rp2040", "embassy-rp/boot2-w25q080"]
pico2 = ["embassy-rp/rp235xa", "embassy-rp/imagedef-secure-exe"]
# Report over USB CDC instead of the UART pins — for a REAL board on a USB
# cable, where GP0/GP1 are wired to nothing:
#   tools/build-pico2.sh pico-odom usb
usb = ["firmware-support/usb", "dep:embassy-usb", "dep:embassy-futures", "dep:static_cell"]
# Take motor commands FROM THE HOST instead of running the calibration
# sweep. Implies `usb`, because a command channel needs a host on the
# other end and GP0/GP1 are wired to nothing on a real board:
#   tools/build-pico2.sh pico-odom teleop
#
# The sweep is not deleted — it is still how `max_wheel_speed` and
# `motor_tau` get measured, and `wheel_radius` is not measured yet.
teleop = ["usb"]
# Bring the OV7670 up on the same board as the motors and announce what
# it is, once, at boot. Costs two I2C pins and one PWM slice, none of
# which the drivetrain uses:
#   tools/build-pico2.sh pico-odom usb,camera
camera = ["dep:ov7670-driver", "dep:blob", "dep:static_cell"]
# The camera commands the wheels: blob left -> turn left, blob small ->
# creep forward. Mutually exclusive with `teleop` (two commanders of one
# drivetrain) and with `wifi` (PIO0/DMA_CH0).
chase = ["usb", "camera"]
# The PCA9685 and the arm servos. Requires `camera` for now: the shared
# I2C bus is threaded through the camera bring-up, and an arm build
# without eyes has nothing to reach the bus with yet:
#   tools/build-pico2.sh pico-odom teleop,camera,arm
arm = ["camera", "dep:pca9685-driver"]
# The whole errand: camera seeks the prop, the car parks/spins/backs up,
# the arm runs the twin-tuned rear pick, the car carries the prize.
#   tools/build-pico2.sh pico-odom fetch
fetch = ["usb", "camera", "arm"]
# Report over UDP on the CYW43 radio instead of a cable — a Pico 2 W with
# no tether. RP2350-only, because RP2040 Picos in this project have no
# radio, and telemetry-only by design (see the compile_error! below):
#   WIFI_SSID=... WIFI_PASSWORD=... tools/build-pico2.sh pico-odom wifi
wifi = [
    "dep:static_cell",
    "dep:cyw43",
    "dep:cyw43-firmware",
    "dep:cyw43-pio",
    "dep:embassy-net",
    "dep:embassy-futures",
]

[dependencies]
embassy-executor = { workspace = true }
embassy-rp = { workspace = true }
embassy-time = { workspace = true }
cortex-m = { workspace = true }
cortex-m-rt = { workspace = true }
panic-halt = { workspace = true }
heapless = { workspace = true }
embassy-usb = { workspace = true, optional = true }
firmware-support = { workspace = true }
embassy-futures = { workspace = true, optional = true }
# The camera's frame buffer and the USB/radio stacks all need a static
# with a runtime-initialised value, and `unsafe_code` is forbidden
# repo-wide so a `static mut` is not an alternative.
#
# ⚠️ Optional, and it must stay that way. `StaticCell` needs atomic
# compare-exchange, which **Cortex-M0+ does not have** — making this
# unconditional builds fine for RP2350 and breaks the RP2040/UART target
# that the emulator uses.
static_cell = { workspace = true, optional = true }
# The radio, and the TCP/IP stack that rides on it. Versions match
# `firmware/pico-led`, which is the build proven to bring the radio up on
# our board #2 — 6 power cycles, 6 successes (docs/e2e-research/28).
cyw43 = { workspace = true, optional = true }
cyw43-firmware = { workspace = true, optional = true }
cyw43-pio = { workspace = true, optional = true }
# The drop queue between the report loop and the radio. Already a
# transitive dependency of embassy-net; named here because `OUTBOX` is
# what keeps a hung radio from reaching the odometry loop.
# The drop queue behind `diag::NOTES`. No longer optional: it used to
# arrive with `wifi` because the radio invented the notes channel, but
# the camera is the second user and a build without a radio still needs
# somewhere to put a sentence.
embassy-sync = { workspace = true }
# `medium-ethernet` because the CYW43 presents as an Ethernet device;
# `dhcpv4` because a bench AP hands out addresses and a hardcoded one is a
# thing that breaks when the robot moves rooms.
embassy-net = { version = "0.9", optional = true, features = [
    "dhcpv4",
    "medium-ethernet",
    "proto-ipv4",
    "udp",
] }
# The driver Prakhar wrote. Same source, two worlds: mocked bus in
# `cargo test` on the Mac, real I2C peripheral here.
quad-encoder = { workspace = true }
# Same source, two worlds: mocked bus in `cargo test` on the Mac, real
# I2C peripheral here.
ov7670-driver = { workspace = true, optional = true }
pca9685-driver = { workspace = true, optional = true }
# On-chip blob detection. Runs HERE rather than on the host because
# streaming 38,400 bytes a frame over USB CDC caps at a few fps, while a
# centroid is six bytes.
blob = { workspace = true, optional = true }
sim-core = { workspace = true }
# The host<->chip vocabulary, shared rather than reinvented. `pico-odom`'s
# STATUS line is still ad-hoc text (see the note in examples/odom_view.rs
# about what that cost); its COMMAND channel is not, because `pico-robot`
# already proved this parser on hardware and `Message::Twist` already
# means exactly what a camera-driven controller wants to say.
hil-protocol = { workspace = true }

[build-dependencies]
firmware-build-support = { workspace = true }

