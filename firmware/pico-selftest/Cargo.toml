[package]
name = "pico-selftest"
version.workspace = true
edition.workspace = true

# Runs the SHARED maths (sim-core) on real silicon, prints results and
# timings over USB serial. Answers two questions we had never tested:
#   1. does sim-core produce the SAME numbers on ARM as on the Mac?
#   2. does a control tick fit inside the 20 ms budget on this chip?
#
#   tools/build-pico2.sh pico-selftest
#   picotool load -x firmware/pico-selftest/pico-selftest-pico2.uf2
#   then open the serial port it presents.

[features]
default = ["rp2040"]
rp2040 = ["embassy-rp/rp2040", "embassy-rp/boot2-w25q080"]
pico2 = ["embassy-rp/rp235xa", "embassy-rp/imagedef-secure-exe"]

[dependencies]
embassy-executor = { workspace = true }
embassy-rp = { workspace = true }
embassy-time = { workspace = true }
embassy-usb = { workspace = true }
# Unconditional here: this firmware exists to report over USB, so
# unlike the others it has no `usb` feature of its own to gate on.
firmware-support = { workspace = true, features = ["usb"] }
embassy-futures = { workspace = true }
heapless = { workspace = true }
cortex-m = { workspace = true }
cortex-m-rt = { workspace = true }
panic-halt = { workspace = true }
sim-core = { workspace = true }

[build-dependencies]
firmware-build-support = { workspace = true }

