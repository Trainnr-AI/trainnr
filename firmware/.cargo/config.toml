[build]
# Default: RP2040 (Cortex-M0+) — the chip the emulator runs.
target = "thumbv6m-none-eabi"

# The PHYSICAL board is a Pico 2 W = RP2350, Cortex-M33 with an FPU.
# Build for it explicitly:
#
#   cargo build --release --no-default-features --features pico2 \
#               --target thumbv8m.main-none-eabihf
#
# or use tools/build-pico2.sh from the repo root.

[target.thumbv6m-none-eabi]
# runner = "probe-rs run --chip RP2040"

[target.thumbv8m.main-none-eabihf]
# Once the Debug Probe is wired (needs a 3-pin header soldered into the
# DEBUG holes — see docs/09), uncomment this and `cargo run` will flash
# and stream logs. VERIFY the chip name first:  probe-rs chip list | grep -i rp
# runner = "probe-rs run --chip RP235x"
