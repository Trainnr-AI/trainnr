# One workspace for every firmware crate.
#
# The laptop workspace at the repo root `exclude`s this directory, because
# these build for ARM Cortex-M and `cargo test` there must never try to
# build them for the Mac. That exclusion is why each crate used to carry a
# bare `[workspace]` of its own — eight standalone workspaces, each with
# its own lock file, each repeating the same eighteen lines.
#
# Two things that were quietly wrong before:
#
#   * `[profile.release]` was declared in all eight. Cargo applies profiles
#     ONLY at a workspace root, so seven of those eight were being ignored.
#     They happened to be identical, so nothing misbehaved — but "identical
#     by luck" is the state this repo keeps finding bugs in.
#   * eight lock files meant eight independent dependency resolutions of
#     the same embassy versions. One workspace resolves once.
#
# Building a single crate still works exactly as before: `build-pico2.sh`
# cd's into the crate directory, and cargo builds that member.
[workspace]
resolver = "2"
members = [
    "build-support",
    "support",
    "pico-blink",
    "pico-button",
    "pico-encoder",
    "pico-imu",
    "pico-led",
    "pico-arm",
    "pico-odom",
    "pico-robot",
    "pico-selftest",
    "pico-camera",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

# The versions every firmware crate agreed on, in one place. A crate that
# needs something different can still say so locally — this is a default,
# not a ceiling.
[workspace.dependencies]
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread"] }
embassy-rp = { version = "0.10", default-features = false, features = ["rt", "time-driver", "critical-section-impl"] }
embassy-time = "0.5"
embassy-futures = "0.1"
embassy-usb = "0.6"
embassy-sync = "0.7"
cortex-m = "0.7"
cortex-m-rt = "0.7"
panic-halt = "1.0"
heapless = "0.9"
static_cell = "2"
cyw43 = "0.7"
cyw43-firmware = { version = "0.1", features = ["wifi"] }
cyw43-pio = "0.10"
embassy-net = { version = "0.9", features = ["dhcpv4", "medium-ethernet", "proto-ipv4", "udp"] }
firmware-build-support = { path = "build-support" }
firmware-support = { path = "support" }
quad-encoder = { path = "../crates/quad-encoder" }
mpu6050-driver = { path = "../crates/mpu6050-driver" }
ov7670-driver = { path = "../crates/ov7670-driver" }
pca9685-driver = { path = "../crates/pca9685-driver" }
blob = { path = "../crates/blob", default-features = false }
sim-core = { path = "../crates/sim-core", default-features = false }
hil-protocol = { path = "../crates/hil-protocol" }

# ⚠️ The ONE place these now take effect. `debug = true` keeps symbols so
# Wokwi and GDB can show source lines; `opt-level = "z"` and `lto` are what
# make a 231 KB radio blob fit alongside the program.
[profile.release]
debug = true
lto = true
opt-level = "z"
