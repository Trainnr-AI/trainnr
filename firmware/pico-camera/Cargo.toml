[package]
name = "pico-camera"
version.workspace = true
edition.workspace = true

# Camera bring-up: generate XCLK, then ask the OV7670 who it is.
#
# ⚠️ USB only, and deliberately. The emulator has no OV7670 to answer, so
# a UART build would prove nothing that a mocked bus in `cargo test -p
# ov7670-driver` does not already prove. This firmware exists for the one
# question the mock cannot answer: is the thing on the desk wired right?
#
#   tools/build-pico2.sh pico-camera usb

[features]
default = ["rp2040"]
rp2040 = ["embassy-rp/rp2040", "embassy-rp/boot2-w25q080"]
pico2 = ["embassy-rp/rp235xa", "embassy-rp/imagedef-secure-exe"]
usb = ["firmware-support/usb", "dep:embassy-usb", "dep:embassy-futures"]

[dependencies]
embassy-executor = { workspace = true }
embassy-rp = { workspace = true }
embassy-time = { workspace = true }
cortex-m = { workspace = true }
cortex-m-rt = { workspace = true }
panic-halt = { workspace = true }
heapless = { workspace = true }
embassy-usb = { workspace = true, optional = true }
embassy-futures = { workspace = true, optional = true }
firmware-support = { workspace = true }
ov7670-driver = { workspace = true }

[build-dependencies]
firmware-build-support = { workspace = true }
