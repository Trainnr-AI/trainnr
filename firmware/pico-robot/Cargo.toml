[package]
name = "pico-robot"
version.workspace = true
edition.workspace = true

# H2b: read a real sensor over I2C, using OUR driver crate — the same
# crate that is unit-tested on the Mac with a mocked bus.

[features]
default = ["rp2040"]
rp2040 = ["embassy-rp/rp2040", "embassy-rp/boot2-w25q080"]
pico2 = ["embassy-rp/rp235xa", "embassy-rp/imagedef-secure-exe"]
# Talk to the host over USB CDC instead of UART pins — for a REAL board on
# a USB cable. The emulator cannot do USB, so this is pico2-only in
# practice.
usb = ["firmware-support/usb", "dep:embassy-usb", "dep:embassy-futures"]

[dependencies]
embassy-executor = { workspace = true }
embassy-rp = { workspace = true }
embassy-time = { workspace = true }
cortex-m = { workspace = true }
cortex-m-rt = { workspace = true }
panic-halt = { workspace = true }
heapless = { workspace = true }
embassy-usb = { workspace = true, optional = true }
firmware-support = { workspace = true }
embassy-futures = { workspace = true, optional = true }
# The driver Prakhar wrote. Same source, two worlds: mocked bus in
# `cargo test` on the Mac, real I2C peripheral here.
quad-encoder = { workspace = true }
sim-core = { workspace = true }
hil-protocol = { workspace = true }

[build-dependencies]
firmware-build-support = { workspace = true }

