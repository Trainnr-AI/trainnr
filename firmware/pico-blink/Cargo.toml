[package]
name = "pico-blink"
version.workspace = true
edition.workspace = true

# H0: blink. Builds for TWO chips:
#
#   cargo build --release
#       RP2040 (Pico 1) for thumbv6m-none-eabi — what the emulator runs.
#
#   cargo build --release --no-default-features --features pico2 \
#               --target thumbv8m.main-none-eabihf
#       RP2350 (Pico 2 W) — the physical board.
#
# The emulator cannot run RP2350 (docs/08), so both paths stay alive.

[features]
default = ["rp2040"]
rp2040 = ["embassy-rp/rp2040", "embassy-rp/boot2-w25q080"]
pico2 = ["embassy-rp/rp235xa", "embassy-rp/imagedef-secure-exe"]

[dependencies]
embassy-executor = { workspace = true }
embassy-rp = { workspace = true }
embassy-time = { workspace = true }
cortex-m = { workspace = true }
cortex-m-rt = { workspace = true }
panic-halt = { workspace = true }

[build-dependencies]
firmware-build-support = { workspace = true }

