[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rq-pipeline"
version = "0.1.0"
description = "Train, validate and serve robot policies with numbers you can sign: identified dynamics, gated simulation, confidence intervals on everything."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "FSL-1.1-ALv2" }

# The core is dependency-free on purpose: the statistics and bundle layers
# must be recomputable anywhere a report is audited — any Python >= 3.10,
# no scipy, no GPU (uv provisions the interpreter). Heavy stages are
# opt-in extras with their own floors:
[project.optional-dependencies]
# gymnasium is the ecosystem's env interface (rq_pipeline.envs); MIT,
# numpy-only, and LeRobot pins the same major (>=1.1.1,<2).
# mujoco is compatible-release PINNED: the engine version is part of the
# identified artifact (docs/e2e-research/49), and the accidental 3.12 bump
# broke nine tests including physics outcomes. Upgrading is a deliberate
# re-identification event: move the pin, re-run every referee, re-measure.
sim = ["mujoco[sysid]~=3.11.0", "gymnasium>=1.1.1,<2"]
# dataset: LeRobotDataset + video decode; smolvla: the first foundation-model
# rung (fits a 24 GB card); training: wandb + accelerate. gym-aloha stays
# out on purpose: its dm_control dependency pins exact MuJoCo versions and
# the harness is our evaluation environment anyway.
train = ["lerobot[dataset,smolvla,training]>=0.6.1; python_version >= '3.12'"]
# CUDA only; the Mac resolves cleanly without it. Pinned like sim and mjx:
# mujoco-warp tracks MuJoCo release for release, so an open floor here would
# drag the engine version with it.
gpu = ["mujoco-warp~=3.11.0; sys_platform != 'darwin'"]
# The batched GPU rollout path (docs/e2e-research/49): MJX with the Warp
# implementation. Runs on Warp's CPU backend too (measured on the Mac),
# so the adapter's tests run anywhere; only speed needs the NVIDIA card.
# COMPATIBLE-RELEASE PIN, deliberately: an open >=3.12 floor dragged the
# whole project from locked mujoco 3.11.0 to 3.12.0 and NINE tests broke
# (pybind enum comparisons AND physics outcomes — the stack ladder lost
# a trial). The engine version is part of the identified artifact; it
# moves by decision, never as a dependency side effect.
mjx = ["mujoco-mjx[warp]~=3.11.0"]
viz = ["rerun-sdk>=0.20"]  # the Rerun viewer; no GPU vendor requirement
# The instrument's MCP surface (rq_pipeline/mcp_server.py): bundles, tasks,
# engines, actuators, runs as queryable tools for any MCP client — the
# Studio's agent panel first. Official SDK, MIT; v2 is a rework of v1, so
# the pin holds the major.
mcp = ["mcp~=2.1"]
# openpi's own websocket client (rq_pipeline/envs/openpi_policy.py): pi0 /
# pi0.5 served from their process, evaluated through our env. Pinned to the
# commit it was read at (docs/e2e-research/43); not on PyPI. Its numpy<2 pin
# is overridden below - measured working on numpy 2.2 (2026-08-27).
remote = [
    "openpi-client @ git+https://github.com/Physical-Intelligence/openpi.git@215abfb217dbac7d5f1273282331b9b1866c0479#subdirectory=packages/openpi-client",
]

# The task registry's plugin door (rq_pipeline/tasks/registry.py): a third
# party lists its task module here under its own name and `lerobot-eval
# --env.task=<namespace>/<task>` finds it. Our own two are listed too.
[project.entry-points."rq_pipeline.tasks"]
aloha2 = "rq_pipeline.tasks.aloha2"
so101 = "rq_pipeline.tasks.so101"

# The engine registry's plugin door (rq_pipeline/physics/registry.py): a
# third engine over the same MJCF registers here and enters through the
# same gauntlet.
[project.entry-points."rq_pipeline.engines"]
mujoco = "rq_pipeline.physics.mujoco_backend"
mjx-warp = "rq_pipeline.physics.mjx_backend"

# The GPU-provider registry's plugin door (rq_pipeline/cloud/provider.py):
# a vendor module registers itself with @provider(name) and is listed here.
[project.entry-points."rq_pipeline.gpu_providers"]
runpod = "rq_pipeline.cloud.runpod"

[tool.setuptools.packages.find]
include = ["rq_pipeline*"]

# Ruff is the whole lint/format story — same role clippy+rustfmt play for
# the crates, and the pre-commit gate runs it the same way. Rules mirror
# docs/18-code-quality.md: no unused anything, no shadowed builtins,
# modern syntax for the real floor, complexity kept visible.
[tool.uv]
# openpi-client declares numpy<2 (its pyproject, 2026-08-27); the client's
# msgpack-numpy codec round-trips on numpy 2.2 (measured) and the train
# venv's torch/mujoco/jax need numpy 2, so the pin is overridden here, once.
override-dependencies = ["numpy>=1.26"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import order
    "N",   # naming
    "UP",  # pyupgrade (respects the py310 floor)
    "B",   # bugbear
    "SIM", # simplification
    "RUF", # ruff-native checks
    "PL",  # pylint subset: complexity + magic values stay visible
]
# PLR2004 (magic values) stays ON: dangling literals get names, as in the
# Rust crates.

[tool.mypy]
# Zero errors as of 2026-09-01; tools/verify.sh gates it. The global
# ignore covers the untyped C extensions (mujoco, mujoco_warp, lerobot);
# rerun/torch/jax/numpy/gymnasium all ship py.typed and are checked.
python_version = "3.10"
ignore_missing_imports = true
files = ["rq_pipeline"]
